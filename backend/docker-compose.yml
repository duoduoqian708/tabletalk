# 可选：为 PostgreSQL / MySQL 方言集成测试提供本地服务。
# 用法：docker compose up -d
# 之后可连 postgres://postgres:postgres@localhost:5432 / mysql://root:root@localhost:3306
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tabletalk
    ports:
      - "5432:5432"
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tabletalk
    ports:
      - "3306:3306"
