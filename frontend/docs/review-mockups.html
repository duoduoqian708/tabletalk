<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库审查 · 交互方案对比</title>
<style>
  :root {
    --bg: #0a0e14; --panel: #11161f; --void2: #161c26; --void3: #1b2230;
    --line: #232a36; --line-strong: #2e3846;
    --ink: #d5dae2; --ink-dim: #8b93a1; --ink-faint: #5a6272;
    --accent: #34f5c5; --accent-dim: rgba(52,245,197,.14);
    --amber: #f5b942; --amber-dim: rgba(245,185,66,.12);
    --red: #f5636e; --green: #4ade80;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --sans: -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; }
  .mono { font-family: var(--mono); }
  .mk-head { position: sticky; top: 0; z-index: 50; background: linear-gradient(180deg, #0c1119 92%, transparent); padding: 14px 20px 10px; backdrop-filter: blur(4px); }
  .mk-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .mk-title small { color: var(--ink-faint); font-weight: 400; margin-left: 10px; font-size: 11px; }
  .mk-tabs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .mk-tab { border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-dim); border-radius: 9px; padding: 6px 14px; cursor: pointer; font-size: 12.5px; transition: all .18s; }
  .mk-tab:hover { color: var(--ink); border-color: var(--ink-faint); }
  .mk-tab.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-dim); }
  .mk-tab .star { color: var(--amber); }
  .mk-note { margin-top: 8px; font-size: 12px; color: var(--ink-dim); min-height: 18px; }
  .mk-note b { color: var(--amber); font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 10px 20px 60px; }
  .mk-view { display: none; }
  .mk-view.on { display: block; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 9px 14px; margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); border-radius: 10px; background: var(--amber-dim); color: var(--amber); font-size: 12.5px; flex-wrap: wrap; }
  .banner .go { margin-left: auto; font-weight: 600; cursor: pointer; }
  .banner .go:hover { text-decoration: underline; }
  .banner .go + .go { margin-left: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tb-search { background: var(--void2); border: 1px solid var(--line-strong); color: var(--ink); border-radius: 9px; padding: 7px 12px; font-size: 12.5px; width: 220px; outline: none; }
  .tb-search:focus { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .chip { border: 1px solid var(--line-strong); background: var(--void2); color: var(--ink-dim); border-radius: 999px; padding: 5px 12px; font-size: 11.5px; cursor: pointer; transition: all .15s; user-select: none; }
  .chip:hover { color: var(--ink); }
  .chip.on { color: var(--accent); background: var(--accent-dim); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .tb-count { font-size: 11px; color: var(--ink-faint); margin-left: auto; }
  .btn-acc { background: var(--accent); color: #04241a; border: 0; border-radius: 9px; padding: 7px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn-acc:hover { filter: brightness(1.08); }
  .btn-acc:disabled { opacity: .35; cursor: default; }
  .tlist { display: flex; flex-direction: column; gap: 3px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border-left: 3px solid transparent; transition: background .12s; }
  .trow:hover { background: var(--void3); }
  .trow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .trow.pending .dot { background: var(--amber); }
  .trow .tname { font-family: var(--mono); font-size: 12.5px; }
  .trow .tcols { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .trow .ttag { font-size: 10.5px; color: var(--ink-faint); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; }
  .trow .spacer { flex: 1; }
  .badge-p { background: var(--amber-dim); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); font-family: var(--mono); font-size: 10.5px; border-radius: 999px; padding: 1px 9px; flex: none; }
  .trow.pending { border-left-color: var(--amber); }
  .trow.done-flash { animation: flash .8s ease-out; }
  @keyframes flash { 0% { background: var(--accent-dim); } 100% { background: transparent; } }
  .row-actions { display: none; align-items: center; gap: 6px; flex: none; }
  .trow:hover .row-actions { display: inline-flex; }
  .ra { border: 1px solid var(--line-strong); background: transparent; color: var(--ink-dim); border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  .ra.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
  .ra.ok:hover { background: color-mix(in srgb, var(--green) 14%, transparent); }
  .ra.no:hover { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .v0-wrap { position: relative; min-height: 640px; border: 1px dashed var(--line-strong); border-radius: 14px; overflow: hidden; background: var(--bg); }
  .v0-page { position: absolute; inset: 0; opacity: .25; padding: 20px; font-size: 12px; color: var(--ink-faint); }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(640px, 92%); background: var(--panel); border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0,0,0,.45); }
  .drawer-h { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .drawer-h .cnt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); font-weight: 400; }
  .drawer-h .x { margin-left: auto; cursor: pointer; color: var(--ink-dim); border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 9px; font-size: 11px; }
  .drawer-b { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-h { display: flex; align-items: center; gap: 8px; }
  .card-h .tn { font-family: var(--mono); font-weight: 600; font-size: 12.5px; }
  .card-h .sp { flex: 1; }
  .cbtn { border: 0; border-radius: 7px; padding: 4px 12px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .cbtn.ok { background: var(--accent); color: #04241a; }
  .cbtn.gh { background: transparent; color: var(--ink-dim); border: 1px solid var(--line-strong); }
  .diff { display: flex; flex-direction: column; gap: 3px; }
  .dl { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
  .dl .k { flex: none; width: 24px; text-align: center; font-family: var(--mono); font-size: 9.5px; border-radius: 4px; padding: 1px 0; }
  .dl.old .k { color: var(--ink-faint); border: 1px solid var(--line-strong); }
  .dl.old .v { color: var(--ink-faint); text-decoration: line-through; }
  .dl.new .k { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .dl .v { flex: 1; line-height: 1.55; }
  .drawer-f { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(80px); background: #0f2a22; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); padding: 10px 20px; border-radius: 10px; font-size: 12.5px; z-index: 99; opacity: 0; transition: all .3s cubic-bezier(.2,.9,.3,1.2); font-family: var(--mono); }
  .toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
  .mini-drawer-mask { position: fixed; inset: 0; background: rgba(2,4,8,.62); z-index: 60; display: none; }
  .mini-drawer-mask.on { display: block; }
  .mini-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, 94%); background: var(--panel); border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0,0,0,.5); }
  .legend { margin-top: 14px; font-size: 11px; color: var(--ink-faint); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .legend i { font-style: normal; }
</style>
</head>
<body>
<header class="mk-head">
  <div class="mk-title">知识库审查 · 交互方案对比 <small>演示数据 · 纯静态 · 不调后端 · 按钮可点（演示反馈）</small></div>
  <div class="mk-tabs">
    <button class="mk-tab" data-v="v0">V0 现状基线</button>
    <button class="mk-tab" data-v="v1">V1 中栏快审</button>
    <button class="mk-tab" data-v="v2">V2 筛选即选择</button>
    <button class="mk-tab on" data-v="v3">V3 组合终态 <span class="star">★推荐</span></button>
  </div>
  <div class="mk-note" id="mkNote"></div>
  <div class="legend">
    <i>● 绿点 = 已生效</i><i>● 琥珀点 = 有待审</i>
    <i><span class="badge-p">N</span> = 该表待审提案数</i>
  </div>
</header>

<main>
  <section class="mk-view" id="v0">
    <div class="v0-wrap">
      <div class="v0-page">知识库三栏页（被抽屉遮蔽）…</div>
      <div class="drawer">
        <div class="drawer-h">审查报告 <span class="cnt" id="v0cnt"></span><span class="x">✕</span></div>
        <div class="drawer-b" id="v0cards"></div>
        <div class="drawer-f">
          <button class="cbtn gh" onclick="toast('演示：放弃本轮')">放弃本轮</button>
          <button class="cbtn ok" onclick="toast('演示：确认启用（全量）')">接受全部</button>
        </div>
      </div>
    </div>
  </section>

  <section class="mk-view" id="v1">
    <div class="toolbar">
      <input class="tb-search" placeholder="搜索表名…" data-search="v1">
      <span class="chip on">只看草案</span>
      <span class="tb-count" id="v1count"></span>
    </div>
    <div class="tlist" id="v1list"></div>
  </section>

  <section class="mk-view" id="v2">
    <div class="banner">
      ⚠ 本轮待审：<b id="v2p">—</b> 项注释 · <b>12</b> 个标签 · <b>9</b> 条边
      <span class="go" onclick="toast('演示：打开审查报告抽屉')">查看审查报告 →</span>
    </div>
    <div class="toolbar">
      <input class="tb-search" placeholder="搜索表名…" data-search="v2">
      <span class="chip on" data-f="draft">只看草案</span>
      <span class="chip" data-f="tag:订单域">订单域</span>
      <span class="chip" data-f="tag:主数据域">主数据域</span>
      <span class="chip" data-f="tag:系统域">系统域</span>
      <button class="btn-acc" id="v2accept">接受当前筛选 <span id="v2selN">—</span> 表</button>
      <span class="tb-count" id="v2count"></span>
    </div>
    <div class="tlist" id="v2list"></div>
  </section>

  <section class="mk-view" id="v3">
    <div class="banner">
      ⚠ 本轮待审：<b id="v3p">—</b> 项注释 · <b>12</b> 个标签 · <b>9</b> 条边
      <span class="go" onclick="document.getElementById('v3drawer').classList.add('on')">审查报告 →</span>
      <span class="go chip" id="v3draftBtn" onclick="toggleDraftOnly()">只看草案</span>
    </div>
    <div class="toolbar">
      <input class="tb-search" placeholder="搜索表名…" data-search="v3">
      <span class="chip" data-f="tag:订单域">订单域</span>
      <span class="chip" data-f="tag:主数据域">主数据域</span>
      <span class="chip" data-f="tag:系统域">系统域</span>
      <button class="btn-acc" id="v3accept">接受当前筛选 <span id="v3selN">—</span> 表</button>
      <span class="tb-count" id="v3count"></span>
    </div>
    <div class="tlist" id="v3list"></div>

    <div class="mini-drawer-mask" id="v3drawer">
      <div class="mini-drawer">
        <div class="drawer-h">审查报告（例外逐项裁决）<span class="cnt">示例 2 张</span><span class="x" onclick="document.getElementById('v3drawer').classList.remove('on')">✕</span></div>
        <div class="drawer-b" id="v3cards"></div>
        <div class="drawer-f">
          <button class="cbtn gh" onclick="toast('演示：放弃本轮')">放弃本轮</button>
          <button class="cbtn ok" onclick="toast('演示：接受全部剩余')">接受全部剩余</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* JS_PART */
/* ══════════ 假数据（确定性伪随机，220 张表） ══════════ */
const DOMAINS = ['订单域', '主数据域', '系统域', '日志审计域', '营销域']
const BASES = ['orders', 'customers', 'products', 'payments', 'shipments', 'inventory', 'campaigns', 'reviews', 'coupons', 'returns', 'ledger', 'agent_http_request', 'agent_llm_session', 'mdm_person', 'mdm_corp', 'mdm_model', 'sys_user', 'sys_role', 'sys_audit', 'sys_operation', 'biz_contract', 'biz_invoice', 'log_gateway', 'log_app']
const SUFFIX = ['', '_log', '_base', '_snapshot', '_view', '_detail', '_archive', '_items']
const NEWCMT = ['销售订单主单据，每笔订单一行，客户下单后生成。又称：销售单', '系统对外 HTTP 请求流水账，用于接口监控与问题排查。又称：API日志', '客户主数据快照，按日全量留存，用于历史追溯', '支付流水明细，记录每笔收退款及其渠道', '库存台账，按仓库+SKU 记录进出', '用户操作审计日志，含前后镜像', '营销活动主档，含预算与投放渠道', '合同主数据，含甲乙方与有效期']
const OLDCMT = ['', '', 'orders', '订单表', '存储订单相关信息', '']
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const rnd = mulberry(42)
const DATA = []
for (let i = 0; i < 220; i++) {
  const name = BASES[Math.floor(rnd() * BASES.length)] + SUFFIX[Math.floor(rnd() * SUFFIX.length)] + (rnd() < .18 ? '_' + (2 + Math.floor(rnd() * 8)) : '')
  if (DATA.some(d => d.name === name)) { i--; continue }
  const done = rnd() < .34
  const domain = DOMAINS[Math.floor(rnd() * DOMAINS.length)]
  const cols = 6 + Math.floor(rnd() * 34)
  const pending = done ? 0 : 1 + Math.floor(rnd() * Math.min(cols, 26))
  DATA.push({ name, cols, domain, done, pending, old: OLDCMT[Math.floor(rnd() * OLDCMT.length)], new: NEWCMT[Math.floor(rnd() * NEWCMT.length)] })
}

/* ══════════ 渲染 ══════════ */
function rowHTML(d) {
  const pend = d.done ? 0 : d.pending
  return `<div class="trow ${pend ? 'pending' : ''}" data-name="${d.name}">
    <span class="dot"></span><span class="tname">${d.name}</span><span class="tcols">${d.cols} 列</span>
    <span class="ttag">${d.domain}</span><span class="spacer"></span>
    ${pend ? `<span class="badge-p">${pend}</span>` : ''}
    <span class="row-actions">
      <button class="ra ok" onclick="acceptOne(this,'${d.name}',${pend})">✓ 接受该表</button>
      <button class="ra no" onclick="rejectOne(this,'${d.name}')">✕ 拒绝</button>
    </span>
  </div>`
}
const renderList = (id) => { document.getElementById(id).innerHTML = DATA.map(rowHTML).join('') }
renderList('v1list'); renderList('v2list'); renderList('v3list')

/* V0 报告卡片（4 张待审示例） */
const sample = DATA.filter(d => !d.done).slice(0, 4)
document.getElementById('v0cards').innerHTML = sample.map(d => `
  <div class="card"><div class="card-h"><span class="tn">${d.name}</span><span class="sp"></span>
    <button class="cbtn ok" onclick="toast('演示：接受 ${d.name}（${d.pending} 项）')">接受该表</button>
    <button class="cbtn gh" onclick="toast('演示：拒绝 ${d.name}')">拒绝</button></div>
    <div class="diff"><div class="dl old"><span class="k">旧</span><span class="v">${d.old || '（无）'}</span></div>
    <div class="dl new"><span class="k">新</span><span class="v">${d.new}</span></div></div>
    <div class="mono" style="font-size:10.5px;color:var(--ink-faint)">…另有 ${Math.max(0, d.pending - 1)} 条字段提案（逐项 ✓✕）</div>
  </div>`).join('')
document.getElementById('v0cnt').textContent = '本轮待审 128 项注释 · 12 标签 · 9 边'
/* V3 迷你报告卡片 */
document.getElementById('v3cards').innerHTML = sample.slice(0, 2).map(d => `
  <div class="card"><div class="card-h"><span class="tn">${d.name}</span><span class="sp"></span>
    <button class="cbtn ok" onclick="toast('演示：接受 ${d.name}')">接受该表</button></div>
    <div class="diff"><div class="dl old"><span class="k">旧</span><span class="v">${d.old || '（无）'}</span></div>
    <div class="dl new"><span class="k">新</span><span class="v">${d.new}</span></div></div></div>`).join('')

/* ══════════ 交互 ══════════ */
let toastTimer = null
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('on')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600)
}
function setRowDone(row, name, action) {
  row.classList.remove('pending')
  row.classList.add('done-flash')
  const b = row.querySelector('.badge-p'); if (b) b.remove()
  const a = row.querySelector('.row-actions'); if (a) a.remove()
  row.querySelector('.dot').style.background = 'var(--green)'
}
function acceptOne(btn, name, pend) {
  setRowDone(btn.closest('.trow'), name, 'ok')
  toast(`演示：已接受 ${name}（${pend} 项提案）· 一次请求批量写入`)
  refreshCounts()
}
function rejectOne(btn, name) {
  setRowDone(btn.closest('.trow'), name, 'no')
  toast(`演示：已拒绝 ${name}（保持当前值）`)
  refreshCounts()
}

/* 筛选（V2/V3）：搜索 + chip；chip 状态互斥（tag 系列单选 + draft 可叠加） */
const vstate = {
  v2: { search: '', draft: true, tag: null },
  v3: { search: '', draft: false, tag: null },
}
function visibleRows(vid) {
  const st = vstate[vid]
  return DATA.filter(d => {
    if (st.search && !d.name.includes(st.search)) return false
    if (st.tag && d.domain !== st.tag) return false
    return true
  })
}
function applyFilter(vid) {
  const st = vstate[vid]
  const listEl = document.getElementById(vid + 'list')
  const rows = listEl.querySelectorAll('.trow')
  rows.forEach((row) => {
    const d = DATA.find(x => x.name === row.dataset.name)
    const isPending = !d.done && d.pending > 0 && !row.classList.contains('done-flash-hidden')
    const show = (!st.draft || (isPending && !row.classList.contains('done-flash-done')))
      && (!st.search || d.name.includes(st.search))
      && (!st.tag || d.domain === st.tag)
      && (st.draft ? isPending : true)
    row.style.display = show ? '' : 'none'
  })
  const n = [...rows].filter(r => r.style.display !== 'none' && r.classList.contains('pending')).length
  document.getElementById(vid + 'count').textContent = `共 ${DATA.length} 张 · 当前筛选待审 ${n} 张`
  const sel = document.getElementById(vid + 'selN')
  if (sel) sel.textContent = n
  document.getElementById(vid + 'accept').disabled = n === 0
  const pt = document.getElementById(vid + 'p')
  if (pt) pt.textContent = DATA.filter(d => !d.done).reduce((s, d) => s + d.pending, 0)
}
function acceptFiltered(vid) {
  const st = vstate[vid]
  const listEl = document.getElementById(vid + 'list')
  const rows = [...listEl.querySelectorAll('.trow')].filter(r => r.style.display !== 'none' && r.classList.contains('pending'))
  let items = 0
  rows.forEach(r => { const d = DATA.find(x => x.name === r.dataset.name); items += d.pending; setRowDone(r, d.name) })
  toast(`演示：已接受 ${rows.length} 张表 · ${items} 项提案（一次请求批量写入）`)
  refreshCounts()
}
document.getElementById('v2accept').onclick = () => acceptFiltered('v2')
document.getElementById('v3accept').onclick = () => acceptFiltered('v3')

/* 搜索框 */
document.querySelectorAll('[data-search]').forEach(inp => {
  const vid = inp.dataset.search
  inp.addEventListener('input', () => { vstate[vid].search = inp.value.trim(); applyFilter(vid) })
})
/* chips（V2/V3 内的 tag/draft chip） */
document.querySelectorAll('.chip[data-f]').forEach(ch => {
  const vid = ch.closest('.mk-view').id
  ch.addEventListener('click', () => {
    const f = ch.dataset.f
    if (f === 'draft') {
      vstate[vid].draft = !vstate[vid].draft
      ch.classList.toggle('on', vstate[vid].draft)
    } else {
      const tag = f.slice(4)
      const on = vstate[vid].tag === tag
      vstate[vid].tag = on ? null : tag
      document.querySelectorAll(`#${vid} .chip[data-f^="tag:"]`).forEach(c => c.classList.toggle('on', !on && c.dataset.f === 'tag:' + tag))
    }
    applyFilter(vid)
  })
})
function toggleDraftOnly() {
  const ch = document.querySelector('#v3 .chip[data-f="draft"]')
  if (!ch) { /* V3 横条内的 draft 按钮：直接切状态 */ }
  vstate.v3.draft = !vstate.v3.draft
  const btn = document.getElementById('v3draftBtn')
  btn.style.color = vstate.v3.draft ? 'var(--accent)' : ''
  applyFilter('v3')
}

/* ══════════ Tab 切换 + 说明 ══════════ */
const NOTES = {
  v0: '<b>V0 现状基线</b>：报告抽屉逐项裁决。几百表时是长卡片墙——全局感与效率都不足。',
  v1: '<b>V1 中栏快审</b>：列表即审阅面。琥珀角标一眼定位待审表，hover 行内一键「接受该表 / 拒绝」，不进详情不进报告。',
  v2: '<b>V2 筛选即选择</b>：组合搜索 / 标签 / 只看草案圈定范围，「接受当前筛选 N 表」一次请求批量收（后端 batch-review 端点）。只看草案 → 一键全收 = 信任型主路径。',
  v3: '<b>V3 组合终态（推荐）</b>：V1+V2 同屏。最短路径「圈定 → 一键收」；个别表 hover 单独处理；争议项点「审查报告」逐项裁决。横条双入口：报告 / 只看草案。',
}
function showTab(vid) {
  document.querySelectorAll('.mk-tab').forEach(b => b.classList.toggle('on', b.dataset.v === vid))
  document.querySelectorAll('.mk-view').forEach(v => v.classList.toggle('on', v.id === vid))
  document.getElementById('mkNote').innerHTML = NOTES[vid]
}
document.querySelectorAll('.mk-tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.v)))

/* 初始化 */
refreshCounts = function () {
  applyFilter('v2'); applyFilter('v3')
  const pend = DATA.filter(d => !d.done)
  document.getElementById('v1count').textContent = `共 ${DATA.length} 张 · 待审 ${pend.length} 张`
  const list1 = document.getElementById('v1list')
  const rows1 = [...list1.querySelectorAll('.trow')]
  rows1.forEach(r => { const d = DATA.find(x => x.name === r.dataset.name); r.style.display = (!d.done && d.pending) ? '' : 'none' })
}
refreshCounts()
showTab('v3')
</script>
</body>
