<!doctype html>
<html lang="zh-CN" data-skin="minimal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLETALK · 三栏工作台 × 5 设计语言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=VT323&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Sora:wght@400;600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   骨架（中性）—— 三栏布局固定，组件全部交给皮肤重写
========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:var(--bar-h,50px) 1fr 28px;height:100vh;position:relative;z-index:1}
.appbar{position:relative;z-index:30}
.winbtns{display:none}
body{font-family:var(--f-sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;transition:background .3s}
.wb{display:grid;grid-template-columns:214px 1fr 296px;gap:10px;padding:10px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.s-tree,.r-body,.a-scroll{flex:1;overflow:auto;min-height:0}
.ds{position:relative}.skin{position:relative}
.tabs{display:flex;gap:2px;height:100%;margin-left:12px}
.tab{display:flex;align-items:center;padding:0 11px;font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);transition:color .14s}
.tab:hover{color:var(--ink)}
.ds-menu,.skin-menu{position:absolute;top:calc(100% + 8px);min-width:225px;padding:5px;opacity:0;pointer-events:none;transform:translateY(-5px);transition:all .18s cubic-bezier(.2,.8,.24,1);z-index:70}
.ds.open .ds-menu,.skin.open .skin-menu{opacity:1;pointer-events:auto;transform:none}
.ds-menu{left:0}.skin-menu{right:0}
.ds-mi,.sk-mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-family:var(--f-mono);font-size:11px;transition:background .12s}
.ds-mi:hover,.sk-mi:hover{background:var(--surface-3)}
.ds-mi .s{margin-left:auto;font-size:9px;color:var(--ink-faint)}
.ds-mi .d,.sk-mi .sw{width:10px;height:10px;border-radius:3px;flex:none}
.ds-mi .ck,.sk-mi .ck{color:var(--teal);font-size:10px;width:12px;text-align:center;margin-left:auto}
.gate-pill{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--teal);border:1px solid var(--teal);border-radius:20px;padding:4px 11px;white-space:nowrap;background:var(--teal-dim)}
.gate-pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--teal)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.thk::before{content:"◇ think";color:var(--blue);letter-spacing:.08em;margin-right:7px;font-size:8px;font-family:var(--f-mono)}
.sql{overflow:hidden}
.sql .c-bar{height:2px}
.sql.allow .c-bar{background:var(--teal)}.sql.review .c-bar{background:var(--amber)}.sql.block .c-bar{background:var(--red)}.sql.manual .c-bar{background:var(--blue)}
.statusline{display:flex;align-items:center;gap:18px;padding:0 16px;font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);border-top:1px solid var(--line)}
.sl-r{margin-left:auto;display:flex;gap:16px}
.sl-r b{color:var(--ink-dim);font-weight:500}

/* =========================================================
   D1 · XP 复古桌面（Windows XP Luna）
   蓝色渐变标题栏 · XP 渐变按钮 · 桌面壁纸 · 任务栏 · 选中蓝
========================================================= */
html[data-skin="xp"]{
  --bar-h:52px;
  --bg:linear-gradient(#3b7edf,#7cc7ff 52%,#a9db92 78%,#5fae52);
  --surface:#ece9d8;--surface-2:#f6f6ee;--surface-3:#dedbc8;
  --line:#a7a69b;--line-strong:#8e8e82;
  --ink:#1f2d4d;--ink-dim:#46527a;--ink-faint:#7b86a0;
  --teal:#1d7a3c;--teal-dim:rgba(29,122,60,.14);
  --amber:#c0781e;--amber-dim:rgba(192,120,30,.14);
  --red:#c0392b;--red-dim:rgba(192,57,43,.1);
  --blue:#245edb;--blue-dim:rgba(36,94,219,.12);
  --f-sans:'Tahoma','PingFang SC','Microsoft YaHei',sans-serif;--f-mono:'Courier New',monospace;--f-logo:'Tahoma',sans-serif;
  --fs:12px;--lh:1.45;
  --shadow:0 1px 2px rgba(0,0,60,.25);
}
html[data-skin="xp"] body{font-size:var(--fs);line-height:var(--lh);background:var(--bg)}
html[data-skin="xp"] .appbar{height:var(--bar-h);display:flex;align-items:center;gap:10px;padding:0 8px;background:linear-gradient(#4f94ef,#2a6be0);border-bottom:1px solid #0831d9;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 0 #9ac0f5}
html[data-skin="xp"] .logo{font-family:var(--f-logo);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,60,.5);display:flex;align-items:center;gap:7px;padding:0 6px}
html[data-skin="xp"] .logo .dot{width:8px;height:8px;background:radial-gradient(circle at 30% 30%,#b7ffa0,#4caf50);border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.4)}
html[data-skin="xp"] .tab{color:#cfe0ff;font-size:12px;padding:2px 10px;border-radius:3px}
html[data-skin="xp"] .tab:hover{background:rgba(255,255,255,.18)}
html[data-skin="xp"] .tab.on{color:#fff;background:linear-gradient(#7db1ff,#2f6bd8);box-shadow:0 1px 1px rgba(0,0,80,.3) inset}
html[data-skin="xp"] .tab.on::after{display:none}
html[data-skin="xp"] .ds-btn,.html[data-skin="xp"] .skin-btn{display:flex;align-items:center;gap:7px;background:linear-gradient(#fdfdf4,#e8e6d6);border:1px solid #8e8e82;border-radius:3px;padding:3px 11px;font-family:var(--f-mono);font-size:11px;color:#1f2d4d;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 1px rgba(0,0,60,.2)}
html[data-skin="xp"] .ds-btn .d{width:8px;height:8px;background:linear-gradient(#7ec850,#4caf50);border-radius:50%;box-shadow:inset 0 -1px 1px rgba(0,0,0,.4)}
html[data-skin="xp"] .ds-menu,.html[data-skin="xp"] .skin-menu{background:#f2f1e5;border:1px solid #0831d9;border-radius:4px;box-shadow:3px 3px 12px rgba(0,0,80,.35)}
html[data-skin="xp"] .col{background:var(--surface);border:1px solid #0831d9;box-shadow:0 1px 2px rgba(0,0,60,.25),inset 0 0 0 1px #fdfdf4}
html[data-skin="xp"] .col-h{display:flex;align-items:center;padding:4px 8px;background:linear-gradient(#fdfdf6,#dcdac8);border-bottom:1px solid #a7a69b;font-family:var(--f-mono);font-size:11px;font-weight:700;color:#1f2d4d}
html[data-skin="xp"] .s-in{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #8e8e82;border-radius:2px;padding:3px 7px;font-size:12px;color:#8a94a8;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
html[data-skin="xp"] .s-in:focus-within{border-color:#245edb}
html[data-skin="xp"] .s-sec{font-size:9px;color:#7b86a0;padding:7px 8px 2px;font-weight:700;text-transform:uppercase}
html[data-skin="xp"] .s-it{display:flex;align-items:center;gap:6px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;color:#33405e;cursor:pointer}
html[data-skin="xp"] .s-it:hover{background:#dbe9f9}
html[data-skin="xp"] .s-it.on{background:linear-gradient(#316ac5,#4993e7);color:#fff}
html[data-skin="xp"] .s-it.on .r{color:#cfe0ff}
html[data-skin="xp"] .s-it .r{font-size:9px;color:#7b86a0;margin-left:auto}
html[data-skin="xp"] .s-col{padding-left:24px;font-family:var(--f-mono);font-size:10px;color:#7b86a0}
html[data-skin="xp"] .r-head{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(#fdfdf6,#dcdac8);border-bottom:1px solid #a7a69b;font-family:var(--f-mono);font-size:11px}
html[data-skin="xp"] table.t{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11px}
html[data-skin="xp"] .t th{background:linear-gradient(#6e9ef0,#3b7edf);border:1px solid #2a5fbd;padding:4px 8px;color:#fff;font-weight:700;text-align:left;font-size:11px;text-shadow:0 1px 1px rgba(0,0,80,.4)}
html[data-skin="xp"] .t td{border:1px solid #d6d4c2;padding:3px 8px;color:#33405e}
html[data-skin="xp"] .t tbody tr:nth-child(even) td{background:#f2f0e2}
html[data-skin="xp"] .t tbody tr:hover td{background:#dbe9f9}
html[data-skin="xp"] .t td.num{text-align:right}
html[data-skin="xp"] .btn{background:linear-gradient(180deg,#ffffff 0%,#ecebe5 48%,#d8d0c4 100%);border:1px solid #a7a69b;border-radius:3px;padding:3px 12px;font-family:var(--f-mono);font-size:11px;color:#1f2d4d;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 1px rgba(0,0,0,.12)}
html[data-skin="xp"] .btn:active{background:linear-gradient(180deg,#d8d0c4,#ffffff);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
html[data-skin="xp"] .btn.pri{background:linear-gradient(#7db1ff,#2f6bd8);color:#fff;border-color:#245edb;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,60,.3)}
html[data-skin="xp"] .btn.warn{background:linear-gradient(#fff3dc,#e8d5a8);color:#7a4e0d;border-color:#c89b3f}
html[data-skin="xp"] .a-field{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #8e8e82;border-radius:2px;padding:4px 8px;font-size:12px;color:#8a94a8;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
html[data-skin="xp"] .a-field:focus-within{border-color:#245edb}
html[data-skin="xp"] .send{background:linear-gradient(#7db1ff,#2f6bd8);color:#fff;border:1px solid #245edb;border-radius:3px;width:28px;height:28px;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
html[data-skin="xp"] .m-u{background:#d8e7ff;border:1px solid #8db3ef;border-radius:3px;padding:6px 10px;font-size:12px;color:var(--ink)}
html[data-skin="xp"] .m-a .txt{font-size:12px;color:var(--ink-dim);line-height:1.6}
html[data-skin="xp"] .sql{background:#fff;border:1px solid #8e8e82;border-radius:3px;box-shadow:var(--shadow)}
html[data-skin="xp"] .sql .c-h{display:flex;gap:7px;padding:4px 8px;background:linear-gradient(#fdfdf6,#dcdac8);border-bottom:1px solid #d6d4c2;font-family:var(--f-mono);font-size:10px;color:#7b86a0}
html[data-skin="xp"] .sql .c-h .v{font-weight:700}
html[data-skin="xp"] .sql.allow .v{color:#1d7a3c}
html[data-skin="xp"] .sql .c-s{font-family:var(--f-mono);font-size:10.5px;color:#33405e;padding:6px 8px;line-height:1.7;white-space:pre-wrap}
html[data-skin="xp"] .sql .c-f{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #d6d4c2;align-items:center}
html[data-skin="xp"] .winbtns{display:flex;gap:3px;margin-left:2px}
html[data-skin="xp"] .winbtns span{width:21px;height:19px;font-family:Tahoma,sans-serif;font-size:10px;line-height:18px;text-align:center;border-radius:3px 3px 0 0;background:linear-gradient(#ffffff,#dcd8c8);border:1px solid #8e8e82;border-bottom:none;color:#1f2d4d;box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
html[data-skin="xp"] .winbtns .wb-close{background:linear-gradient(#ffb3a0,#e05a3f);color:#fff;border-color:#b03a20}
html[data-skin="xp"] .statusline{background:linear-gradient(#316ac5,#4993e7 50%,#15529a);border-top:1px solid #0831d9;color:#dce8ff;height:28px}
html[data-skin="xp"] .statusline b{color:#fff}
html[data-skin="xp"] .gate .sig{position:relative;width:64px;height:5px;background:rgba(255,255,255,.3);border-radius:2px}
html[data-skin="xp"] .gate .sig i{position:absolute;inset:0;background:linear-gradient(#a9e08f,#6db04f);transform-origin:left;animation:sw 2.4s linear infinite}
@keyframes sw{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
/* =========================================================
   D2 · GLASS 真玻璃拟态（Glassmorphism）
   彩色光斑背景被 backdrop-filter 真实模糊穿透 · 白玻璃 · 高光描边
========================================================= */
html[data-skin="glass"]{
  --bar-h:50px;
  --bg:#232352;
  --surface:rgba(255,255,255,.07);--surface-2:rgba(255,255,255,.05);--surface-3:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.2);--line-strong:rgba(255,255,255,.32);
  --ink:#10141f;--ink-dim:#3a4356;--ink-faint:#7a8496;
  --teal:#0a9d6a;--teal-dim:rgba(10,157,106,.14);
  --amber:#b4760e;--amber-dim:rgba(180,118,14,.13);
  --red:#d4453a;--red-dim:rgba(212,69,58,.12);
  --blue:#2f6fd0;--blue-dim:rgba(47,111,208,.14);
  --f-sans:'Sora','PingFang SC',sans-serif;--f-mono:'JetBrains Mono',monospace;--f-logo:'Sora',sans-serif;
  --fs:12px;--lh:1.7;
  --shadow:0 24px 60px -30px rgba(0,0,0,.7);
}
html[data-skin="glass"] body{font-size:var(--fs);line-height:var(--lh);background:
  radial-gradient(420px 320px at 12% 12%,rgba(255,110,180,.6),transparent 62%),
  radial-gradient(520px 380px at 85% 18%,rgba(70,160,255,.6),transparent 62%),
  radial-gradient(480px 360px at 55% 96%,rgba(90,220,170,.55),transparent 62%),
  radial-gradient(300px 240px at 95% 60%,rgba(255,200,80,.45),transparent 60%),
  linear-gradient(135deg,#2a2a5c,#1c1c46 55%,#3a2460)}
html[data-skin="glass"] .appbar{display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
html[data-skin="glass"] .logo{font-family:var(--f-logo);font-weight:600;font-size:14px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 10px rgba(255,255,255,.25)}
html[data-skin="glass"] .logo .dot{width:9px;height:9px;background:linear-gradient(135deg,#6affc0,#38a8ff);border-radius:50%;box-shadow:0 0 14px rgba(120,255,200,.6)}
html[data-skin="glass"] .tab{color:rgba(255,255,255,.75)}
html[data-skin="glass"] .tab:hover{color:#fff}
html[data-skin="glass"] .tab.on{color:#fff}
html[data-skin="glass"] .tab.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2px;background:linear-gradient(90deg,#6affc0,#38a8ff);border-radius:2px}
html[data-skin="glass"] .ds-btn,.html[data-skin="glass"] .skin-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);border-radius:11px;padding:7px 13px;font-family:var(--f-mono);font-size:11px;color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 20px -8px rgba(0,0,0,.4)}
html[data-skin="glass"] .ds-btn:hover,.html[data-skin="glass"] .skin-btn:hover{border-color:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 20px rgba(120,255,200,.25)}
html[data-skin="glass"] .ds-btn .d{width:8px;height:8px;background:linear-gradient(135deg,#6affc0,#38a8ff);border-radius:50%;box-shadow:0 0 10px rgba(120,255,200,.8)}
html[data-skin="glass"] .ds-menu,.html[data-skin="glass"] .skin-menu{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:16px;backdrop-filter:blur(30px) saturate(160%);box-shadow:0 30px 70px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.3)}
html[data-skin="glass"] .ds-mi,.html[data-skin="glass"] .sk-mi{color:#fff}
html[data-skin="glass"] .ds-mi:hover,.html[data-skin="glass"] .sk-mi:hover{background:rgba(255,255,255,.16)}
html[data-skin="glass"] .col{background:var(--surface);border:1px solid rgba(255,255,255,.24);border-radius:20px;backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.1),0 30px 70px -34px rgba(0,0,0,.8)}
html[data-skin="glass"] .col-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.16);font-family:var(--f-mono);font-size:10px;color:rgba(20,30,60,.72);letter-spacing:.1em;font-weight:600}
html[data-skin="glass"] .s-in{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:8px 12px;font-size:12px;color:#5a6472;backdrop-filter:blur(8px);box-shadow:inset 0 2px 8px rgba(0,0,0,.18)}
html[data-skin="glass"] .s-in:focus-within{border-color:rgba(255,255,255,.5);box-shadow:inset 0 2px 8px rgba(0,0,0,.18),0 0 0 3px rgba(120,255,200,.18)}
html[data-skin="glass"] .s-sec{font-size:8.5px;letter-spacing:.16em;color:rgba(20,30,60,.5);text-transform:uppercase;padding:12px 16px 5px}
html[data-skin="glass"] .s-it{display:flex;align-items:center;gap:8px;padding:6px 16px;font-family:var(--f-mono);font-size:11.5px;color:#2a3346;cursor:pointer;border-radius:9px;margin:0 7px}
html[data-skin="glass"] .s-it:hover{background:rgba(255,255,255,.16);color:#10141f}
html[data-skin="glass"] .s-it.on{background:linear-gradient(120deg,rgba(106,255,192,.3),rgba(56,168,255,.28));color:#0c4a2e;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
html[data-skin="glass"] .s-it .r{font-size:8.5px;color:rgba(20,30,60,.45);margin-left:auto}
html[data-skin="glass"] .s-col{padding-left:30px;font-family:var(--f-mono);font-size:10px;color:rgba(20,30,60,.55);line-height:1.8}
html[data-skin="glass"] table.t{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11px}
html[data-skin="glass"] .t th{background:rgba(255,255,255,.1);text-align:left;padding:8px 14px;color:#45506b;font-weight:600;font-size:9px;border-bottom:1px solid rgba(255,255,255,.24);white-space:nowrap;letter-spacing:.04em}
html[data-skin="glass"] .t td{padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.14);color:#1f2636;white-space:nowrap}
html[data-skin="glass"] .t tbody tr:hover td{background:rgba(255,255,255,.14);color:#10141f}
html[data-skin="glass"] .t td.num{text-align:right}
html[data-skin="glass"] .btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:6px 14px;font-family:var(--f-mono);font-size:10px;color:#2a3346;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px -6px rgba(0,0,0,.3)}
html[data-skin="glass"] .btn:hover{border-color:rgba(255,255,255,.5)}
html[data-skin="glass"] .btn.pri{background:linear-gradient(120deg,#22c98a,#2f8bff);color:#04160d;font-weight:600;border:none;box-shadow:0 8px 26px -8px rgba(47,139,255,.5),inset 0 1px 0 rgba(255,255,255,.4)}
html[data-skin="glass"] .btn.warn{color:#7a4e0d;border-color:rgba(255,200,80,.5);background:rgba(255,200,80,.16)}
html[data-skin="glass"] .a-field{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:10px 14px;font-size:13px;color:#5a6472;backdrop-filter:blur(8px);box-shadow:inset 0 2px 8px rgba(0,0,0,.2)}
html[data-skin="glass"] .a-field:focus-within{border-color:rgba(255,255,255,.5);box-shadow:inset 0 2px 8px rgba(0,0,0,.2),0 0 0 3px rgba(120,255,200,.18)}
html[data-skin="glass"] .send{width:32px;height:32px;border-radius:12px;background:linear-gradient(120deg,#22c98a,#2f8bff);color:#04160d;font-size:14px;font-weight:600;box-shadow:0 8px 22px -8px rgba(47,139,255,.5),inset 0 1px 0 rgba(255,255,255,.4)}

html[data-skin="minimal"] .s-it.on{background:var(--teal-dim);color:var(--teal)}
html[data-skin="minimal"] .s-it .r{font-size:8.5px;color:var(--ink-faint);margin-left:auto}
html[data-skin="minimal"] .s-col{padding-left:30px;font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);line-height:1.8}
html[data-skin="minimal"] .r-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px}
html[data-skin="minimal"] table.t{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11px}
html[data-skin="minimal"] .t th{background:transparent;text-align:left;padding:8px 14px;color:var(--ink-faint);font-weight:500;font-size:9px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
html[data-skin="minimal"] .t td{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
html[data-skin="minimal"] .t tbody tr:hover td{background:var(--surface-2);color:var(--ink)}
html[data-skin="minimal"] .t td.num{text-align:right}
html[data-skin="minimal"] .btn{background:transparent;border:1px solid var(--line-strong);border-radius:20px;padding:6px 16px;font-family:var(--f-mono);font-size:10px;color:var(--ink-dim);transition:all .15s}
html[data-skin="minimal"] .btn:hover{border-color:var(--ink)}
html[data-skin="minimal"] .btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
html[data-skin="minimal"] .btn.pri:hover{background:#0a6dff;border-color:#0a6dff}
html[data-skin="minimal"] .btn.warn{color:var(--amber);border-color:rgba(200,135,30,.5)}
html[data-skin="minimal"] .a-field{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-faint)}
html[data-skin="minimal"] .a-field:focus-within{border-color:var(--teal);background:var(--surface);box-shadow:0 0 0 3px var(--teal-dim)}
html[data-skin="minimal"] .send{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px}
html[data-skin="minimal"] .send:hover{background:var(--teal)}
html[data-skin="minimal"] .m-u{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 3px 12px;padding:9px 13px;font-size:13px;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,60,.05)}
html[data-skin="minimal"] .m-a .txt{font-size:13px;color:var(--ink-dim);line-height:1.7}
html[data-skin="minimal"] .sql{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 8px 24px -14px rgba(20,30,60,.15)}
html[data-skin="minimal"] .sql .c-h{display:flex;gap:8px;padding:9px 13px;font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.08em}
html[data-skin="minimal"] .sql .c-h .v{font-weight:600}
html[data-skin="minimal"] .sql.allow .v{color:var(--teal)}
html[data-skin="minimal"] .sql .c-s{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-dim);padding:10px 13px;line-height:1.7;white-space:pre-wrap;border-top:1px solid var(--line)}
html[data-skin="minimal"] .sql .c-f{display:flex;gap:8px;padding:9px 13px;border-top:1px solid var(--line);align-items:center}
html[data-skin="minimal"] .statusline{background:var(--surface);border-top:1px solid var(--line)}
html[data-skin="minimal"] .gate .sig{position:relative;width:64px;height:3px;background:var(--surface-3);border-radius:3px;overflow:hidden}
html[data-skin="minimal"] .gate .sig i{position:absolute;inset:0;background:var(--teal);transform-origin:left;animation:sw 2.4s cubic-bezier(.2,.8,.24,1) infinite}
@keyframes sw{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <span class="logo"><span class="dot"></span>TABLETALK</span>
    <div class="ds" id="ds">
      <button class="ds-btn" id="dsBtn"><span class="d" id="dsDot"></span><span id="dsName">demo.db</span><span style="opacity:.5;font-size:9px">▾</span></button>
      <div class="ds-menu">
        <button class="ds-mi" data-db="demo.db"><span class="d" style="background:var(--teal)"></span>demo.db<span class="s">sqlite</span><span class="ck">✓</span></button>
        <button class="ds-mi" data-db="prod-mysql"><span class="d" style="background:var(--blue)"></span>prod-mysql<span class="s">mysql</span><span class="ck"></span></button>
        <button class="ds-mi" data-db="analytics-pg"><span class="d" style="background:var(--amber)"></span>analytics-pg<span class="s">postgres</span><span class="ck"></span></button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on">工作台</button><button class="tab">安全闸门</button><button class="tab">知识图谱</button><button class="tab">审计</button>
    </nav>
    <span class="spacer" style="flex:1"></span>
    <div class="skin" id="skin">
      <button class="skin-btn" id="skinBtn"><span style="width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,var(--teal),var(--blue))"></span><span id="skinName">北欧极简</span> ▾</button>
      <div class="skin-menu" id="skinMenu">
        <button class="sk-mi" data-skin="xp"><span class="sw" style="background:linear-gradient(#4f94ef,#2a6be0)"></span>Windows XP 桌面<span class="ck">✓</span></button>
        <button class="sk-mi" data-skin="glass"><span class="sw" style="background:radial-gradient(circle at 30% 30%,#6affc0,#38a8ff)"></span>真玻璃拟态<span class="ck"></span></button>
        <button class="sk-mi" data-skin="crt"><span class="sw" style="background:#0a160c;border:1px solid #35d46f"></span>复古终端 · CRT<span class="ck"></span></button>
        <button class="sk-mi" data-skin="editorial"><span class="sw" style="background:#fdfaf3;border:1px solid #c9bd9f"></span>印刷编辑 · 杂志<span class="ck"></span></button>
        <button class="sk-mi" data-skin="minimal"><span class="sw" style="background:#fff;border:1px solid #e0e3e9"></span>北欧极简 · 扁平<span class="ck"></span></button>
      </div>
    </div>
    <span class="gate-pill"><i></i>armed</span>
    <span class="winbtns"><span class="wb-min">_</span><span class="wb-max">□</span><span class="wb-close">✕</span></span>
  </header>

  <main class="wb">
    <div class="col">
      <div class="col-h">schema<span class="meta" style="margin-left:auto;font-size:8.5px;color:var(--ink-faint)" id="scMeta"></span></div>
      <div class="s-search" style="padding:8px;border-bottom:1px solid var(--line)"><div class="s-in">⌕ filter…</div></div>
      <div class="s-tree" id="sTree"></div>
    </div>
    <div class="col">
      <div class="r-head"><span class="fst ok" id="rFst" style="font-size:8px;padding:2px 7px;border-radius:10px;color:var(--teal);background:var(--teal-dim)">READ · ALLOW</span><span class="r-sql" id="rSql"></span><span class="r-ms" id="rMs" style="margin-left:auto;font-size:9px;color:var(--ink-faint)"></span></div>
      <div class="r-body" id="rBody"></div>
    </div>
    <div class="col">
      <div class="col-h">assistant<span class="meta" style="margin-left:auto;font-size:8.5px;color:var(--ink-faint)">model: mock</span></div>
      <div class="a-scroll" id="aScroll"></div>
      <div class="a-in" style="display:flex;gap:7px;padding:9px 11px;border-top:1px solid var(--line)">
        <div class="a-field" contenteditable="true" id="aField">ask your database…</div>
        <button class="send" id="aSend">→</button>
      </div>
    </div>
  </main>

  <footer class="statusline">
    <span class="gate"><span>gate</span><span class="sig"><i></i></span><span style="color:var(--teal);font-weight:600">armed</span></span>
    <span>model : mock</span>
    <span>dialect : <b id="slDialect" style="color:var(--ink-dim);font-weight:500">sqlite</b></span>
    <div class="sl-r"><span>audit <b>128</b></span><span>⌘⏎ 运行</span></div>
  </footer>
</div>

<script>
const DBS={
  'demo.db':{dot:'var(--teal)',dialect:'sqlite',tables:{
    orders:{rows:'12.4k',ic:'var(--teal)',cols:[['id','int'],['customer_id','fk'],['status','text'],['total','real'],['created_at','datetime']],data:[['10248','31','shipped','440.00','2026-08-01'],['10249','44','pending','1863.40','2026-08-01']]},
    customers:{rows:'3.1k',ic:'var(--blue)',cols:[['id','int'],['name','text'],['region','text'],['level','text']],data:[['1','Acme Trading','华东','gold'],['2','北辰工业','华北','silver']]},
    products:{rows:'1.2k',ic:'var(--blue)',cols:[['id','int'],['name','text'],['price','real'],['category_id','fk']],data:[['101','低温酸奶','12.50','3'],['102','全脂牛奶','15.00','3']]},
    categories:{rows:'86',ic:'var(--blue)',cols:[['id','int'],['name','text']],data:[['3','乳品'],['6','咖啡茶饮']]},
    order_items:{rows:'31.8k',ic:'var(--blue)',cols:[['id','int'],['order_id','fk'],['product_id','fk'],['qty','int']],data:[['1','10248','101','2'],['2','10249','103','1']]},
    suppliers:{rows:'54',ic:'var(--blue)',cols:[['id','int'],['name','text'],['city','text']],data:[['1','乳源牧业','呼和浩特']]}
  }},
  'prod-mysql':{dot:'var(--blue)',dialect:'mysql',tables:{
    inventory:{rows:'8.2k',ic:'var(--blue)',cols:[['sku','varchar'],['qty','int'],['reorder','int']],data:[['SKU-1001','42','20'],['SKU-1002','6','20']]},
    users:{rows:'45k',ic:'var(--blue)',cols:[['id','int'],['email','varchar'],['status','enum']],data:[['1','a@x.com','active'],['2','b@x.com','suspended']]},
    payments:{rows:'120k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['amount','decimal']],data:[['1','88401','99.00'],['2','88402','340.50']]},
    shipments:{rows:'118k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['status','enum']],data:[['1','88401','delivered'],['2','88402','in_transit']]},
    refunds:{rows:'3.1k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['amount','decimal']],data:[['1','88010','99.00']]}
  }},
  'analytics-pg':{dot:'var(--amber)',dialect:'postgres',tables:{
    events:{rows:'2.1M',ic:'var(--blue)',cols:[['id','bigint'],['event','text'],['user_id','int']],data:[['1','page_view','9041'],['2','signup','9042']]},
    sessions:{rows:'410k',ic:'var(--blue)',cols:[['id','uuid'],['pages','int'],['duration','int']],data:[['s-001','7','660'],['s-002','2','40']]},
    funnel_steps:{rows:'22k',ic:'var(--blue)',cols:[['step','text'],['conversion','numeric']],data:[['visit','100%'],['signup','42%']]},
    cohorts:{rows:'96',ic:'var(--blue)',cols:[['month','date'],['retention','numeric']],data:[['2026-05','38%'],['2026-06','41%']]}
  }}
}
function aiReply(q){
  const s=q.toLowerCase()
  if(s.includes('delete')||s.includes('删'))return{tier:'block',think:'检测到无 WHERE 的 DELETE → 闸门判定 BLOCK',txt:'这条不会执行：',sql:"DELETE FROM orders",r:'无 WHERE 的 DELETE 被拦截。建议加条件后确认。'}
  if(s.includes('update')||s.includes('改价')||s.includes('更新'))return{tier:'review',think:'写操作：先预览影响行 → 交你确认',txt:'写操作，需确认：',sql:"UPDATE products SET price = price * 1.05 WHERE category_id = 3",p:'将影响约 24 行'}
  if(s.includes('create')||s.includes('索引'))return{tier:'manual',think:'DDL 是手动边界：AI 只生成草稿',txt:'DDL 草稿（AI 不执行）：',sql:"CREATE INDEX idx_orders_status ON orders(status)"}
  if(s.includes('退货'))return{tier:'allow',think:'按商品聚合退货占比 → 排序取前 10',txt:'读操作，直接放行：',sql:"SELECT p.name, COUNT(*) AS total, SUM(o.status='returned') AS ret\nFROM order_items oi\nJOIN orders o ON o.id=oi.order_id\nJOIN products p ON p.id=oi.product_id\nGROUP BY p.name ORDER BY ret/total DESC LIMIT 10",table:'products'}
  if(s.includes('销售'))return{tier:'allow',think:'按品类聚合销售额',txt:'读操作，直接放行：',sql:"SELECT c.name, ROUND(SUM(oi.price*oi.qty),2) sales\nFROM categories c JOIN products p ON p.category_id=c.id\nJOIN order_items oi ON oi.product_id=p.id\nJOIN orders o ON o.id=oi.order_id\nGROUP BY c.name ORDER BY sales DESC",table:'categories'}
  return{tier:'allow',think:'按客户聚合订单数',txt:'读操作，直接放行：',sql:"SELECT c.name, COUNT(o.id) AS orders\nFROM customers c JOIN orders o ON o.customer_id=c.id\nGROUP BY c.name ORDER BY orders DESC LIMIT 10",table:'customers'}
}
const SKINS={xp:'Windows XP',glass:'真玻璃',crt:'复古终端',editorial:'印刷编辑',minimal:'北欧极简'}
let CUR='demo.db',CUR_TAB=null
const sTree=document.getElementById('sTree'),rBody=document.getElementById('rBody'),aScroll=document.getElementById('aScroll')
function renderSchema(){
  const db=DBS[CUR];sTree.innerHTML='<div class="s-sec">tables</div>'
  Object.entries(db.tables).forEach(([n,t])=>{
    const el=document.createElement('div')
    el.innerHTML=`<div class="s-it ${n===CUR_TAB?'on':''}" data-t="${n}"><span class="ic" style="color:${t.ic}">▚</span>${n}<span class="r">${t.rows}</span></div>`
    if(n===CUR_TAB)t.cols.forEach(c=>el.insertAdjacentHTML('beforeend',`<div class="s-col">${c[0]} <span class="ty">${c[1]}</span></div>`))
    sTree.appendChild(el)
  })
  document.querySelectorAll('.s-it').forEach(it=>it.addEventListener('click',()=>{CUR_TAB=it.dataset.t;renderSchema();renderResults()}))
  document.getElementById('scMeta').textContent=`${Object.keys(db.tables).length} 表`
}
function renderResults(){
  const db=DBS[CUR]
  if(!CUR_TAB){rBody.innerHTML='<div style="padding:26px;text-align:center;color:var(--ink-faint)">← 选择一张表，或让 AI 生成查询</div>';return}
  const t=db.tables[CUR_TAB]
  document.getElementById('rSql').textContent=`SELECT * FROM ${CUR_TAB} LIMIT 500`
  document.getElementById('rMs').textContent=`${t.rows} 行 · 预览`
  document.getElementById('rFst').textContent='READ · ALLOW';document.getElementById('rFst').style.color='var(--teal)';document.getElementById('rFst').style.background='var(--teal-dim)'
  rBody.innerHTML='<table class="t"><thead><tr>'+t.cols.map(c=>`<th>${c[0]}<span class="ty"> ${c[1]}</span></th>`).join('')+'</tr></thead><tbody>'+t.data.map(r=>'<tr>'+r.map((v,i)=>`<td${/int|real/.test(t.cols[i][1])?' class="num"':''}>${v}</td>`).join('')+'</tr>').join('')+'</tbody></table>'
}
function switchDb(k){
  CUR=k;const db=DBS[k]
  document.getElementById('dsDot').style.background=db.dot
  document.getElementById('dsName').textContent=k
  document.getElementById('slDialect').textContent=db.dialect
  document.querySelectorAll('.ds-mi').forEach(m=>m.querySelector('.ck').textContent=m.dataset.db===k?'✓':'')
  CUR_TAB=null;renderSchema();renderResults()
  addMsg('已切换到 <b>'+k+'</b>（'+db.dialect+'）· schema 与上下文已刷新。')
}
function addMsg(html){
  const d=document.createElement('div');d.className='m-a';d.innerHTML='<div class="txt">'+html+'</div>'
  aScroll.appendChild(d);aScroll.scrollTop=aScroll.scrollHeight;return d
}
function send(q){
  const u=document.createElement('div');u.className='m-u';u.textContent=q;aScroll.appendChild(u)
  setTimeout(()=>{
    const r=aiReply(q)
    const extra=r.tier==='review'?`<span class="c-p" style="font-size:9.5px;color:var(--amber);margin-right:auto">${r.p}</span>`:r.tier==='block'?`<span class="c-r" style="font-size:9.5px;color:var(--red);margin-right:auto">${r.r}</span>`:''
    const d=addMsg('')
    d.innerHTML=`<div class="thk">${r.think}</div><div class="txt">${r.txt}</div><div class="sql ${r.tier}"><div class="c-bar"></div><div class="c-h"><span class="v">${r.tier.toUpperCase()}</span>${r.tier==='allow'?' · read':r.tier==='review'?' · dml':r.tier==='block'?' · blocked':' · ddl'}</div><div class="c-s">${r.sql}</div><div class="c-f">${extra}<button class="btn ${r.tier==='allow'?'pri':r.tier==='review'?'warn':r.tier==='manual'?'gho':'danger'}" data-act="${r.tier}">${r.tier==='allow'?'运行':r.tier==='review'?'确认执行':r.tier==='manual'?'发送到编辑器':'已拦截'}</button></div></div>`
    aScroll.scrollTop=aScroll.scrollHeight
    d.querySelector('[data-act]').addEventListener('click',b=>{
      const t=b.target.dataset.act
      if(t==='allow'){const sql=b.target.closest('.sql').querySelector('.c-s').textContent;const m=sql.match(/FROM\s+(\w+)/i);if(m){CUR_TAB=m[1];renderSchema();renderResults()}}
      if(t==='review'){b.target.textContent='已确认执行 ✓';b.target.style.color='var(--teal)';b.target.style.borderColor='var(--teal)';b.target.style.background='var(--teal-dim)'}
      if(t==='manual'){b.target.textContent='已发送到编辑器 ✓';b.target.style.color='var(--blue)'}
    })
  },450)
}
function setSkin(k){
  document.documentElement.dataset.skin=k
  document.getElementById('skinName').textContent=SKINS[k]
  document.querySelectorAll('.sk-mi').forEach(m=>m.querySelector('.ck').textContent=m.dataset.skin===k?'✓':'')
  try{localStorage.setItem('tabletalk-skin2',k)}catch{}
}
document.getElementById('dsBtn').addEventListener('click',()=>document.getElementById('ds').classList.toggle('open'))
document.addEventListener('click',e=>{if(!e.target.closest('#ds'))document.getElementById('ds').classList.remove('open')})
document.querySelectorAll('.ds-mi').forEach(m=>m.addEventListener('click',()=>{switchDb(m.dataset.db);document.getElementById('ds').classList.remove('open')}))
document.getElementById('skinBtn').addEventListener('click',()=>document.getElementById('skin').classList.toggle('open'))
document.addEventListener('click',e=>{if(!e.target.closest('#skin'))document.getElementById('skin').classList.remove('open')})
document.querySelectorAll('.sk-mi').forEach(m=>m.addEventListener('click',()=>{setSkin(m.dataset.skin);document.getElementById('skin').classList.remove('open')}))
document.getElementById('aSend').addEventListener('click',()=>{const f=document.getElementById('aField');const q=f.textContent.trim();if(q&&!q.startsWith('ask your')){f.textContent='ask your database…';send(q)}})
document.getElementById('aField').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('aSend').click()}})
document.getElementById('aField').addEventListener('focus',()=>{if(document.getElementById('aField').textContent.startsWith('ask your'))document.getElementById('aField').textContent=''})
document.getElementById('aField').addEventListener('blur',()=>{if(!document.getElementById('aField').textContent.trim())document.getElementById('aField').textContent='ask your database…'})
;(()=>{let k='minimal';try{k=localStorage.getItem('tabletalk-skin2')||'minimal'}catch{};setSkin(k)})()
renderSchema()
addMsg('我是 TABLETALK 的 AI 副驾。试试问 <b>退货率最高的 10 个商品</b>，或输入 <span style="color:var(--red)">delete from orders</span> 看安全闸门拦截。')
</script>
</body>
</html>
