<!doctype html>
<html lang="zh-CN" data-skin="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABLETALK · 三栏工作台 × 7 风格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=VT323&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Sora:wght@400;600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   基础（默认 = NEON 科技感）
========================================================= */
:root{
  --bg:#060714;--surface:rgba(20,26,58,.55);--surface-2:rgba(16,20,44,.72);--surface-3:rgba(32,40,80,.5);
  --line:rgba(120,200,255,.16);--line-strong:rgba(120,200,255,.3);
  --ink:#dfeaff;--ink-dim:#9fb4e0;--ink-faint:#5b6b99;
  --teal:#3affd0;--teal-dim:rgba(58,255,208,.1);
  --amber:#ffb648;--amber-dim:rgba(255,182,72,.1);
  --red:#ff5c6e;--red-dim:rgba(255,92,110,.1);
  --blue:#7d8bff;--blue-dim:rgba(125,139,255,.12);
  --f-sans:'JetBrains Mono','PingFang SC',monospace;--f-mono:'JetBrains Mono',monospace;
  --f-logo:'Audiowide',cursive;
  --radius:10px;--radius-sm:7px;
  --bar-bg:rgba(8,10,26,.7);--mask:rgba(4,6,18,.7);
  --scan:none;--grid-lines:linear-gradient(rgba(120,200,255,.05) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(120,200,255,.05) 1px,transparent 1px) 0 0/32px 100%;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  --grad-btn:var(--teal);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-sans);color:var(--ink);background:var(--grid-lines),var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;transition:background .4s}
body::before{content:"";position:fixed;inset:0;background:var(--scan);pointer-events:none;z-index:0}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:50px 1fr 28px;height:100vh;position:relative;z-index:1}
/* ---------- appbar ---------- */
.appbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bar-bg);backdrop-filter:blur(12px);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-logo);font-size:14px;letter-spacing:.12em;white-space:nowrap}
.logo .dot{width:8px;height:8px;border-radius:2px;background:var(--teal);transform:rotate(45deg);animation:armed 2.8s infinite;box-shadow:0 0 10px var(--teal)}
@keyframes armed{0%{box-shadow:0 0 0 0 var(--teal)}75%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.logo .dim{opacity:.55;font-size:9px;letter-spacing:.1em}
/* 数据源锚 */
.ds{position:relative}
.ds-btn{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;padding:6px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s;white-space:nowrap}
.ds-btn:hover{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.ds-btn .d{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none;box-shadow:0 0 6px var(--teal)}
.ds-btn .chev{font-size:8px;color:var(--ink-faint);transition:transform .2s}
.ds.open .ds-btn .chev{transform:rotate(180deg)}
.ds-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:225px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(-5px);transition:all .18s cubic-bezier(.2,.8,.24,1);z-index:60}
.ds.open .ds-menu{opacity:1;pointer-events:auto;transform:none}
.ds-mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-family:var(--f-mono);font-size:11px;transition:background .12s}
.ds-mi:hover{background:var(--surface-3)}
.ds-mi .d{width:7px;height:7px;border-radius:50%;flex:none}
.ds-mi .s{margin-left:auto;font-size:9px;color:var(--ink-faint)}
.ds-mi .ck{color:var(--teal);font-size:10px;width:12px;text-align:center}
.tabs{display:flex;gap:2px;height:100%;margin-left:12px}
.tab{display:flex;align-items:center;padding:0 11px;font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);position:relative;transition:color .14s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2px;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.spacer{flex:1}
/* 风格切换 */
.skin{position:relative}
.skin-btn{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;padding:5px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink-dim);transition:all .14s}
.skin-btn:hover{color:var(--ink);border-color:var(--ink-faint)}
.skin-btn .sw{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--teal),var(--blue));flex:none}
.skin-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(-5px);transition:all .18s;z-index:70}
.skin.open .skin-menu{opacity:1;pointer-events:auto;transform:none}
.sk-mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:11px;transition:background .12s}
.sk-mi:hover{background:var(--surface-3)}
.sk-mi .sw{width:11px;height:11px;border-radius:4px;flex:none}
.sk-mi .ck{color:var(--teal);font-size:10px;width:12px;text-align:center;margin-left:auto}
.gate-pill{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--teal);border:1px solid var(--teal);background:var(--teal-dim);border-radius:20px;padding:4px 11px;white-space:nowrap}
.gate-pill i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--teal)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* ---------- workbench ---------- */
.wb{display:grid;grid-template-columns:214px 1fr 296px;gap:10px;padding:10px;min-height:0}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.col-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:.05em;flex:none}
.col-h .meta{margin-left:auto;font-size:8.5px;color:var(--ink-faint)}
.s-search{padding:8px;border-bottom:1px solid var(--line)}
.s-in{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);padding:5px 9px;font-size:11px;color:var(--ink-faint)}
.s-in:focus-within{border-color:var(--teal)}
.s-tree{flex:1;overflow:auto}
.s-sec{font-family:var(--f-mono);font-size:8px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;padding:9px 12px 4px}
.s-it{display:flex;align-items:center;gap:7px;padding:4.5px 12px;font-family:var(--f-mono);font-size:11px;color:var(--ink-dim);cursor:pointer;border-left:2px solid transparent;line-height:1.7;transition:background .1s,color .1s}
.s-it:hover{background:var(--teal-dim);color:var(--ink)}
.s-it.on{background:var(--teal-dim);color:var(--ink);border-left-color:var(--teal)}
.s-it .r{font-size:8px;color:var(--ink-faint);margin-left:auto}
.s-it .ic{font-size:9px;width:12px;text-align:center}
.s-col{padding-left:30px;font-family:var(--f-mono);font-size:9.5px;color:var(--ink-faint);line-height:1.7}
.s-col .ty{font-size:8px;opacity:.8}
.r-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10px;flex:none}
.fst{font-size:8px;padding:2px 7px;border-radius:10px;flex:none}
.fst.ok{color:var(--teal);background:var(--teal-dim)}
.fst.warn{color:var(--amber);background:var(--amber-dim)}
.fst.bad{color:var(--red);background:var(--red-dim)}
.r-sql{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-ms{margin-left:auto;font-size:9px;color:var(--ink-faint);white-space:nowrap}
.r-body{flex:1;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:10.5px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:6px 11px;color:var(--ink-faint);font-weight:500;font-size:8.5px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.t th .ty{font-weight:400;font-size:8px;opacity:.8;margin-left:4px}
.t th .arr{color:var(--teal);font-size:7px;margin-left:3px}
.t td{padding:5px 11px;border-bottom:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
.t td.num{text-align:right}
.t tbody tr:hover td{background:var(--surface-2);color:var(--ink)}
.t .empty{padding:26px;text-align:center;color:var(--ink-faint);font-family:var(--f-sans);font-size:12px}
.a-scroll{flex:1;overflow:auto;padding:11px;display:flex;flex-direction:column;gap:12px}
.m-u{align-self:flex-end;max-width:88%;font-size:12px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:7px 11px;color:var(--ink)}
.m-a{align-self:stretch;display:flex;flex-direction:column;gap:7px}
.thk{font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);line-height:1.5}
.thk::before{content:"◇ think";color:var(--blue);letter-spacing:.08em;margin-right:7px;font-size:8px}
.m-a .txt{font-size:12px;color:var(--ink-dim);line-height:1.6}
.sql{border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.sql .c-bar{height:2px}
.sql.allow .c-bar{background:var(--teal)}.sql.review .c-bar{background:var(--amber)}.sql.block .c-bar{background:var(--red)}.sql.manual .c-bar{background:var(--blue)}
.sql .c-h{display:flex;align-items:center;gap:7px;padding:6px 10px;font-family:var(--f-mono);font-size:8.5px;color:var(--ink-faint);letter-spacing:.08em}
.sql .c-h .v{font-weight:600}
.sql.allow .v{color:var(--teal)}.sql.review .v{color:var(--amber)}.sql.block .v{color:var(--red)}.sql.manual .v{color:var(--blue)}
.sql .c-s{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-dim);padding:7px 10px;line-height:1.7;border-top:1px solid var(--line);white-space:pre-wrap}
.sql .c-f{display:flex;gap:6px;padding:7px 10px;border-top:1px solid var(--line);align-items:center}
.sql .c-p{font-size:9.5px;color:var(--amber);margin-right:auto;font-family:var(--f-mono)}
.sql .c-r{font-size:9.5px;color:var(--red);margin-right:auto;font-family:var(--f-mono)}
.btn{font-family:var(--f-mono);font-size:9.5px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid transparent;transition:all .14s}
.btn.pri{background:var(--grad-btn);color:var(--bg);font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gho{color:var(--ink-dim);border-color:var(--line-strong)}
.btn.gho:hover{color:var(--ink);border-color:var(--ink-faint)}
.btn.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-dim)}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.a-in{display:flex;gap:7px;padding:9px 11px;border-top:1px solid var(--line);flex:none}
.a-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-sm);padding:7px 10px;font-size:11.5px;color:var(--ink-faint);transition:border-color .14s}
.a-field:focus-within{border-color:var(--teal)}
.a-field .kbd{font-size:8px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;margin-left:auto;font-family:var(--f-mono)}
.send{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--grad-btn);color:var(--bg);font-size:13px;flex:none;transition:filter .14s}
.send:hover{filter:brightness(1.12)}
.statusline{display:flex;align-items:center;gap:18px;padding:0 16px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:9px;color:var(--ink-faint);background:var(--bar-bg)}
.gate{display:flex;align-items:center;gap:8px}
.sig{position:relative;width:80px;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.sig i{position:absolute;inset:0;background:var(--teal);transform-origin:left;animation:sw 2.4s cubic-bezier(.2,.8,.24,1) infinite;box-shadow:0 0 8px var(--teal)}
@keyframes sw{0%{transform:scaleX(0)}55%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.gv{color:var(--teal);font-weight:600}
.sl-r{margin-left:auto;display:flex;gap:16px}
.sl-r b{color:var(--ink-dim);font-weight:500}

/* =========================================================
   S1 · NEURAL 神经 AI（AI 感）
========================================================= */
html[data-skin="neural"]{
  --bg:#0b0620;--surface:rgba(255,255,255,.055);--surface-2:rgba(255,255,255,.045);--surface-3:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.1);--line-strong:rgba(190,165,255,.24);
  --ink:#f0ecff;--ink-dim:#c4b8e8;--ink-faint:#8a7fb5;
  --teal:#34c99b;--teal-dim:rgba(52,201,155,.12);
  --amber:#e0a347;--amber-dim:rgba(224,163,71,.1);
  --red:#ef6b8f;--red-dim:rgba(239,107,143,.1);
  --blue:#8a7bff;--blue-dim:rgba(138,123,255,.14);
  --f-sans:'Sora','PingFang SC',sans-serif;--f-mono:'JetBrains Mono',monospace;--f-logo:'Sora',sans-serif;
  --radius:14px;--radius-sm:10px;
  --bar-bg:rgba(12,8,36,.72);--mask:rgba(8,5,26,.7);
  --grid-lines:radial-gradient(220px 140px at 12% 8%,rgba(138,123,255,.16),transparent 60%),radial-gradient(260px 180px at 88% 92%,rgba(239,107,143,.14),transparent 60%);
  --shadow:0 22px 50px -24px rgba(0,0,0,.7);--grad-btn:linear-gradient(135deg,#8a7bff,#ef6b8f);
}
html[data-skin="neural"] .logo{font-weight:600;letter-spacing:.02em}
html[data-skin="neural"] .logo .dot{width:8px;height:8px;border-radius:50%;transform:none;background:radial-gradient(circle,#ff8fe0,#8a7bff)}
html[data-skin="neural"] .thk::before{content:"◇ think "}
html[data-skin="neural"] .sql{border-radius:12px}

/* =========================================================
   S2 · TERMINAL 复古终端
========================================================= */
html[data-skin="terminal"]{
  --bg:#0a1208;--surface:rgba(10,22,10,.55);--surface-2:rgba(8,18,9,.6);--surface-3:rgba(20,40,20,.4);
  --line:rgba(93,240,139,.22);--line-strong:rgba(93,240,139,.42);
  --ink:#7dffa5;--ink-dim:#5df08b;--ink-faint:#3d9a5c;
  --teal:#5df08b;--teal-dim:rgba(93,240,139,.1);
  --amber:#e6c33f;--amber-dim:rgba(230,195,63,.1);
  --red:#ff6b6b;--red-dim:rgba(255,107,107,.1);
  --blue:#7dd0ff;--blue-dim:rgba(125,208,255,.1);
  --f-sans:'VT323','PingFang SC',monospace;--f-mono:'VT323',monospace;--f-logo:'VT323',monospace;
  --radius:4px;--radius-sm:2px;
  --bar-bg:rgba(8,16,8,.85);
  --scan:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  --grid-lines:linear-gradient(rgba(93,240,139,.05) 1px,transparent 1px) 0 0/100% 22px;
  --shadow:inset 0 0 30px rgba(0,0,0,.85);--grad-btn:var(--teal);
}
html[data-skin="terminal"] body{font-size:15px}
html[data-skin="terminal"] .logo{font-size:17px}
html[data-skin="terminal"] .logo .dot{background:var(--teal);box-shadow:0 0 6px var(--teal);border-radius:50%;transform:none}
html[data-skin="terminal"] .appbar,html[data-skin="terminal"] .col{border-radius:2px}
html[data-skin="terminal"] .thk::before{content:"> think ";color:var(--blue)}
html[data-skin="terminal"] .gate-pill{border-style:dashed}
html[data-skin="terminal"] .a-field::after{content:"▊";animation:blink 1s steps(1) infinite;color:var(--teal)}
@keyframes blink{50%{opacity:0}}
html[data-skin="terminal"] .t th{background:rgba(8,18,9,.8)}
html[data-skin="terminal"] .m-u{border-radius:2px}
html[data-skin="terminal"] .t td,html[data-skin="terminal"] .t th{font-size:12px}

/* =========================================================
   S3 · PAPER 编辑纸感
========================================================= */
html[data-skin="paper"]{
  --bg:#f4efe4;--surface:#fdfaf3;--surface-2:#f4eee0;--surface-3:#ebe3d0;
  --line:#e4dcc9;--line-strong:#cfc4aa;
  --ink:#2b2620;--ink-dim:#6f675c;--ink-faint:#a89f90;
  --teal:#0c8f66;--teal-dim:rgba(12,143,102,.08);
  --amber:#a97a2c;--amber-dim:rgba(169,122,44,.08);
  --red:#c0392b;--red-dim:rgba(192,57,43,.06);
  --blue:#2f6f9e;--blue-dim:rgba(47,111,158,.08);
  --f-sans:'Newsreader','PingFang SC',serif;--f-mono:'JetBrains Mono',monospace;--f-logo:'Newsreader',serif;
  --radius:6px;--radius-sm:4px;
  --bar-bg:rgba(247,243,233,.92);
  --grid-lines:radial-gradient(rgba(60,50,30,.055) 1px,transparent 1px);
  --shadow:0 1px 2px rgba(80,60,30,.06);--grad-btn:var(--teal);
}
html[data-skin="paper"] body{background-size:3px 3px}
html[data-skin="paper"] .logo{font-weight:600;letter-spacing:.01em;font-size:16px}
html[data-skin="paper"] .logo .dot{border-radius:50%;transform:none;box-shadow:none}
html[data-skin="paper"] .col{box-shadow:none}
html[data-skin="paper"] .col-h{letter-spacing:.1em;text-transform:uppercase;font-size:8.5px;border-bottom:2px solid var(--line)}
html[data-skin="paper"] .t th{font-family:var(--f-sans);font-size:10px;letter-spacing:.02em;background:var(--surface-2)}
html[data-skin="paper"] .t td{border-bottom:1px solid var(--line)}
html[data-skin="paper"] .thk::before{content:"批注 ▸ ";color:var(--red)}
html[data-skin="paper"] .s-it{border-left:0;border-bottom:1px dotted var(--line)}
html[data-skin="paper"] .s-it.on{border-left:2px solid var(--red);border-bottom:1px dotted var(--line)}
html[data-skin="paper"] .m-u{background:#fff;border-radius:2px}
html[data-skin="paper"] .a-field{background:#fff}
html[data-skin="paper"] .btn.pri{background:var(--ink);color:#fff}
html[data-skin="paper"] .statusline,html[data-skin="paper"] .appbar{border-color:var(--line-strong)}

/* =========================================================
   S4 · MINIMAL 北欧极简
========================================================= */
html[data-skin="minimal"]{
  --bg:#fbfbfc;--surface:#ffffff;--surface-2:#f5f6f8;--surface-3:#eceef1;
  --line:#eef0f3;--line-strong:#dde1e7;
  --ink:#14181d;--ink-dim:#5c6675;--ink-faint:#9aa3b1;
  --teal:#0a6dff;--teal-dim:rgba(10,109,255,.07);
  --amber:#c8871e;--amber-dim:rgba(200,135,30,.07);
  --red:#d4453a;--red-dim:rgba(212,69,58,.06);
  --blue:#0a6dff;--blue-dim:rgba(10,109,255,.07);
  --f-sans:'Hanken Grotesk','PingFang SC',sans-serif;--f-mono:'JetBrains Mono',monospace;--f-logo:'Hanken Grotesk',sans-serif;
  --radius:12px;--radius-sm:8px;
  --bar-bg:rgba(255,255,255,.85);
  --grid-lines:none;--shadow:none;--grad-btn:var(--teal);
}
html[data-skin="minimal"] .logo{font-weight:600;letter-spacing:.18em;font-size:12px}
html[data-skin="minimal"] .logo .dot{width:7px;height:7px;border-radius:50%;transform:none;box-shadow:none}
html[data-skin="minimal"] .col{box-shadow:none}
html[data-skin="minimal"] .col-h{padding:11px 14px}
html[data-skin="minimal"] .s-it,html[data-skin="minimal"] .t td{padding-top:6px;padding-bottom:6px}
html[data-skin="minimal"] .btn.pri{border-radius:20px;padding:5px 14px}
html[data-skin="minimal"] .gate-pill{border:0;background:var(--surface-2)}
html[data-skin="minimal"] .a-field,html[data-skin="minimal"] .s-in{border-radius:8px}
html[data-skin="minimal"] .thk::before{content:"· "}

/* =========================================================
   S5 · CLASSIC 传统数据库客户端
========================================================= */
html[data-skin="classic"]{
  --bg:#eef1f5;--surface:#ffffff;--surface-2:#f2f4f7;--surface-3:#e4e8ee;
  --line:#d5dae2;--line-strong:#b9c0cb;
  --ink:#2c3a4b;--ink-dim:#55636f;--ink-faint:#7d8a97;
  --teal:#2e8b57;--teal-dim:rgba(46,139,87,.1);
  --amber:#b9741a;--amber-dim:rgba(185,116,26,.1);
  --red:#c0392b;--red-dim:rgba(192,57,43,.08);
  --blue:#2472c8;--blue-dim:rgba(36,114,200,.1);
  --f-sans:'Segoe UI','PingFang SC',sans-serif;--f-mono:'Consolas',monospace;--f-logo:'Segoe UI',sans-serif;
  --radius:2px;--radius-sm:2px;
  --bar-bg:linear-gradient(#e9edf2,#dde3ea);--grid-lines:none;
  --shadow:0 1px 2px rgba(30,50,80,.08);--grad-btn:var(--teal);
}
html[data-skin="classic"] .appbar{height:46px}
html[data-skin="classic"] .logo{font-weight:700;letter-spacing:.02em;font-size:12px;color:#1a4f8b}
html[data-skin="classic"] .logo .dot{border-radius:50%;transform:none;box-shadow:none;background:#2e8b57;width:7px;height:7px}
html[data-skin="classic"] .col{border-radius:0;box-shadow:none}
html[data-skin="classic"] .col-h{background:linear-gradient(#f7f9fb,#e9edf2);font-weight:600;font-size:10px}
html[data-skin="classic"] .t th{background:#dde4ec;color:#33475b;font-weight:600;border-bottom:1px solid #b9c0cb}
html[data-skin="classic"] .t tbody tr:nth-child(even) td{background:#f6f8fa}
html[data-skin="classic"] .t td{border-bottom:1px solid #e4e8ee;font-size:10.5px}
html[data-skin="classic"] .btn{background:linear-gradient(#fdfdfd,#eceff3);border:1px solid #aeb6c2;border-radius:2px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
html[data-skin="classic"] .btn.pri{background:linear-gradient(#5aa04a,#3f8838);color:#fff;border-color:#2f6d2b}
html[data-skin="classic"] .btn:hover{background:linear-gradient(#fdfdfd,#dde3ea)}
html[data-skin="classic"] .send{background:linear-gradient(#5aa04a,#3f8838);color:#fff;border:1px solid #2f6d2b;border-radius:2px}
html[data-skin="classic"] .m-u{background:#eaf3ec}
html[data-skin="classic"] .a-field,html[data-skin="classic"] .s-in{background:#fff;border:1px solid #aeb6c2}
html[data-skin="classic"] .statusline{background:linear-gradient(#dde3ea,#d0d7e0)}
html[data-skin="classic"] .ds-menu,html[data-skin="classic"] .skin-menu{border-radius:2px;background:#fff;border:1px solid #b9c0cb}
html[data-skin="classic"] .thk::before{content:"◆ "}

/* =========================================================
   S6 · XP 复古桌面
========================================================= */
html[data-skin="xp"]{
  --bg:#3b7edf;--surface:#ece9d8;--surface-2:#f6f6ee;--surface-3:#e0ddc9;
  --line:#a7a69b;--line-strong:#8e8e82;
  --ink:#1f2d4d;--ink-dim:#46527a;--ink-faint:#7b86a0;
  --teal:#1d7a3c;--teal-dim:rgba(29,122,60,.12);
  --amber:#c0781e;--amber-dim:rgba(192,120,30,.12);
  --red:#c0392b;--red-dim:rgba(192,57,43,.1);
  --blue:#245edb;--blue-dim:rgba(36,94,219,.1);
  --f-sans:'Tahoma','PingFang SC',sans-serif;--f-mono:'Courier New',monospace;--f-logo:'Tahoma',sans-serif;
  --radius:2px;--radius-sm:0px;
  --bar-bg:linear-gradient(#4f94ef,#2a6be0);--grid-lines:none;
  --shadow:0 2px 6px rgba(0,0,60,.4);--grad-btn:linear-gradient(#4b8bee,#1f5ad0);
}
html[data-skin="xp"] .logo{color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,60,.4)}
html[data-skin="xp"] .logo .dot{background:#c7ffb0;border-radius:50%;transform:none;box-shadow:0 0 4px rgba(255,255,255,.6);width:7px;height:7px}
html[data-skin="xp"] .appbar{height:44px}
html[data-skin="xp"] .tab{color:#dbe8ff}
html[data-skin="xp"] .tab.on{color:#fff;background:rgba(255,255,255,.14)}
html[data-skin="xp"] .tab.on::after{display:none}
html[data-skin="xp"] .col{border-radius:0;background:var(--surface);box-shadow:none;border-color:var(--line)}
html[data-skin="xp"] .col-h{background:linear-gradient(#fdfdf6,#eae8d8);border-bottom:1px solid #a7a69b;font-size:10px;font-weight:700}
html[data-skin="xp"] .t th{background:linear-gradient(#6e9ef0,#3b7edf);color:#fff;font-weight:700;border-bottom:1px solid #2a5fbd;text-shadow:0 1px 1px rgba(0,0,80,.3)}
html[data-skin="xp"] .t tbody tr:nth-child(even) td{background:#f2f0e2}
html[data-skin="xp"] .t td{border-bottom:1px solid #d6d4c2;font-size:10.5px}
html[data-skin="xp"] .btn{background:linear-gradient(#ffffff,#ecece0);border:1px solid #a7a69b;border-radius:3px;box-shadow:inset 0 1px 0 #fff}
html[data-skin="xp"] .btn.pri{background:linear-gradient(#54b54a,#2f8f28);color:#fff;border-color:#247a1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
html[data-skin="xp"] .btn:hover{background:linear-gradient(#ffffff,#d6d4c2)}
html[data-skin="xp"] .send{background:linear-gradient(#54b54a,#2f8f28);color:#fff;border:1px solid #247a1e;border-radius:3px}
html[data-skin="xp"] .m-u{background:#d8e7ff;border-color:#8db3ef}
html[data-skin="xp"] .a-field,html[data-skin="xp"] .s-in{background:#fff;border:1px solid #a7a69b}
html[data-skin="xp"] .ds-btn,html[data-skin="xp"] .skin-btn,html[data-skin="xp"] .gate-pill{background:linear-gradient(#fdfdf4,#e8e6d6);border:1px solid #a7a69b;border-radius:3px}
html[data-skin="xp"] .gate-pill{color:#1d7a3c;border-color:#8bbf8b}
html[data-skin="xp"] .statusline{background:linear-gradient(#e8e6d6,#dcdac8);border-top:1px solid #a7a69b}
html[data-skin="xp"] .ds-menu,html[data-skin="xp"] .skin-menu{background:var(--surface);border:1px solid #8e8e82;border-radius:3px;box-shadow:2px 2px 6px rgba(0,0,60,.3)}
html[data-skin="xp"] .thk::before{content:"◆ "}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <span class="logo"><span class="dot"></span>TABLETALK <span class="dim" id="skinDim">NEON</span></span>
    <div class="ds" id="ds">
      <button class="ds-btn" id="dsBtn"><span class="d" id="dsDot"></span><span id="dsName">demo.db</span><span class="chev">▼</span></button>
      <div class="ds-menu">
        <button class="ds-mi" data-db="demo.db"><span class="d" style="background:var(--teal)"></span>demo.db<span class="s">sqlite</span><span class="ck">✓</span></button>
        <button class="ds-mi" data-db="prod-mysql"><span class="d" style="background:var(--blue)"></span>prod-mysql<span class="s">mysql</span><span class="ck"></span></button>
        <button class="ds-mi" data-db="analytics-pg"><span class="d" style="background:var(--amber)"></span>analytics-pg<span class="s">postgres</span><span class="ck"></span></button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on">工作台</button><button class="tab">安全闸门</button><button class="tab">知识图谱</button><button class="tab">审计</button>
    </nav>
    <span class="spacer"></span>
    <div class="skin" id="skin">
      <button class="skin-btn" id="skinBtn"><span class="sw"></span><span id="skinName">科技感</span> ▾</button>
      <div class="skin-menu" id="skinMenu">
        <button class="sk-mi" data-skin="neon"><span class="sw" style="background:linear-gradient(135deg,#3affd0,#ff5c6e)"></span>科技感 · NEON<span class="ck">✓</span></button>
        <button class="sk-mi" data-skin="neural"><span class="sw" style="background:linear-gradient(135deg,#8a7bff,#ef6b8f)"></span>AI 感 · NEURAL<span class="ck"></span></button>
        <button class="sk-mi" data-skin="terminal"><span class="sw" style="background:#5df08b"></span>复古终端 · TERMINAL<span class="ck"></span></button>
        <button class="sk-mi" data-skin="paper"><span class="sw" style="background:#f4efe4;border:1px solid #cfc4aa"></span>编辑纸感 · PAPER<span class="ck"></span></button>
        <button class="sk-mi" data-skin="minimal"><span class="sw" style="background:#fbfbfc;border:1px solid #dde1e7"></span>北欧极简 · MINIMAL<span class="ck"></span></button>
        <button class="sk-mi" data-skin="classic"><span class="sw" style="background:#eef1f5;border:1px solid #b9c0cb"></span>经典 DB · CLASSIC<span class="ck"></span></button>
        <button class="sk-mi" data-skin="xp"><span class="sw" style="background:#3b7edf"></span>Windows XP<span class="ck"></span></button>
      </div>
    </div>
    <span class="gate-pill"><i></i>gate armed</span>
  </header>

  <main class="wb">
    <div class="col">
      <div class="col-h">schema<span class="meta" id="scMeta"></span></div>
      <div class="s-search"><div class="s-in">⌕ filter…</div></div>
      <div class="s-tree" id="sTree"></div>
    </div>
    <div class="col">
      <div class="r-head"><span class="fst ok" id="rFst">READ · ALLOW</span><span class="r-sql" id="rSql"></span><span class="r-ms" id="rMs"></span></div>
      <div class="r-body" id="rBody"></div>
    </div>
    <div class="col">
      <div class="col-h">assistant<span class="meta">model: mock</span></div>
      <div class="a-scroll" id="aScroll"></div>
      <div class="a-in">
        <div class="a-field" contenteditable="true" id="aField" data-ph="ask your database…">ask your database…</div>
        <button class="send" id="aSend">→</button>
      </div>
    </div>
  </main>

  <footer class="statusline">
    <span class="gate"><span>gate</span><span class="sig"><i></i></span><span class="gv">armed</span></span>
    <span>model : mock</span>
    <span>dialect : <b id="slDialect">sqlite</b></span>
    <div class="sl-r"><span>audit <b>128</b></span><span>⌘K 聚焦 · ⌘⏎ 运行</span></div>
  </footer>
</div>

<script>
const DBS={
  'demo.db':{dot:'var(--teal)',dialect:'sqlite',tables:{
    orders:{rows:'12.4k',ic:'var(--teal)',cols:[['id','int'],['customer_id','fk'],['status','text'],['total','real'],['created_at','datetime']],data:[['10248','31','shipped','440.00','2026-08-01'],['10249','44','pending','1863.40','2026-08-01'],['10250','8','shipped','1552.60','2026-08-02']]},
    customers:{rows:'3.1k',ic:'var(--blue)',cols:[['id','int'],['name','text'],['region','text'],['level','text']],data:[['1','Acme Trading','华东','gold'],['2','北辰工业','华北','silver']]},
    products:{rows:'1.2k',ic:'var(--blue)',cols:[['id','int'],['name','text'],['price','real'],['category_id','fk']],data:[['101','低温酸奶','12.50','3'],['102','全脂牛奶','15.00','3']]},
    categories:{rows:'86',ic:'var(--blue)',cols:[['id','int'],['name','text']],data:[['3','乳品'],['6','咖啡茶饮']]},
    order_items:{rows:'31.8k',ic:'var(--blue)',cols:[['id','int'],['order_id','fk'],['product_id','fk'],['qty','int']],data:[['1','10248','101','2'],['2','10249','103','1']]},
    suppliers:{rows:'54',ic:'var(--blue)',cols:[['id','int'],['name','text'],['city','text']],data:[['1','乳源牧业','呼和浩特']]}
  }},
  'prod-mysql':{dot:'var(--blue)',dialect:'mysql',tables:{
    inventory:{rows:'8.2k',ic:'var(--blue)',cols:[['sku','varchar'],['qty','int'],['reorder','int']],data:[['SKU-1001','42','20'],['SKU-1002','6','20']]},
    users:{rows:'45k',ic:'var(--blue)',cols:[['id','int'],['email','varchar'],['status','enum']],data:[['1','a@x.com','active'],['2','b@x.com','suspended']]},
    payments:{rows:'120k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['amount','decimal']],data:[['1','88401','99.00'],['2','88402','340.50']]},
    shipments:{rows:'118k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['status','enum']],data:[['1','88401','delivered'],['2','88402','in_transit']]},
    refunds:{rows:'3.1k',ic:'var(--blue)',cols:[['id','int'],['order_id','int'],['amount','decimal']],data:[['1','88010','99.00']]}
  }},
  'analytics-pg':{dot:'var(--amber)',dialect:'postgres',tables:{
    events:{rows:'2.1M',ic:'var(--blue)',cols:[['id','bigint'],['event','text'],['user_id','int']],data:[['1','page_view','9041'],['2','signup','9042']]},
    sessions:{rows:'410k',ic:'var(--blue)',cols:[['id','uuid'],['pages','int'],['duration','int']],data:[['s-001','7','660'],['s-002','2','40']]},
    funnel_steps:{rows:'22k',ic:'var(--blue)',cols:[['step','text'],['conversion','numeric']],data:[['visit','100%'],['signup','42%']]},
    cohorts:{rows:'96',ic:'var(--blue)',cols:[['month','date'],['retention','numeric']],data:[['2026-05','38%'],['2026-06','41%']]}
  }}
}
function aiReply(q){
  const s=q.toLowerCase()
  if(s.includes('delete')||s.includes('删'))return{tier:'block',think:'检测到无 WHERE 的 DELETE → 闸门判定 BLOCK',txt:'这条不会执行：',sql:"DELETE FROM orders",r:'无 WHERE 的 DELETE 被拦截。建议加条件后确认。'}
  if(s.includes('update')||s.includes('改价')||s.includes('更新'))return{tier:'review',think:'写操作：先预览影响行 → 交你确认',txt:'写操作，需确认：',sql:"UPDATE products SET price = price * 1.05 WHERE category_id = 3",p:'将影响约 24 行'}
  if(s.includes('create')||s.includes('索引'))return{tier:'manual',think:'DDL 是手动边界：AI 只生成草稿',txt:'DDL 草稿（AI 不执行）：',sql:"CREATE INDEX idx_orders_status ON orders(status)"}
  if(s.includes('退货'))return{tier:'allow',think:'按商品聚合退货占比 → 排序取前 10',txt:'读操作，直接放行：',sql:"SELECT p.name, COUNT(*) AS total, SUM(o.status='returned') AS ret\nFROM order_items oi\nJOIN orders o ON o.id=oi.order_id\nJOIN products p ON p.id=oi.product_id\nGROUP BY p.name ORDER BY ret/total DESC LIMIT 10",table:'products'}
  if(s.includes('销售'))return{tier:'allow',think:'按品类聚合销售额',txt:'读操作，直接放行：',sql:"SELECT c.name, ROUND(SUM(oi.price*oi.qty),2) sales\nFROM categories c JOIN products p ON p.category_id=c.id\nJOIN order_items oi ON oi.product_id=p.id\nJOIN orders o ON o.id=oi.order_id\nGROUP BY c.name ORDER BY sales DESC",table:'categories'}
  return{tier:'allow',think:'按客户聚合订单数',txt:'读操作，直接放行：',sql:"SELECT c.name, COUNT(o.id) AS orders\nFROM customers c JOIN orders o ON o.customer_id=c.id\nGROUP BY c.name ORDER BY orders DESC LIMIT 10",table:'customers'}
}
const SKINS={neon:['科技感','NEON'],neural:['AI 感','NEURAL'],terminal:['复古终端','TERMINAL'],paper:['编辑纸感','PAPER'],minimal:['北欧极简','MINIMAL'],classic:['经典 DB','CLASSIC'],xp:['Windows XP','XP']}
let CUR='demo.db',CUR_TAB=null
const sTree=document.getElementById('sTree'),rBody=document.getElementById('rBody'),aScroll=document.getElementById('aScroll')
function renderSchema(){
  const db=DBS[CUR];sTree.innerHTML='<div class="s-sec">tables</div>'
  Object.entries(db.tables).forEach(([n,t])=>{
    const el=document.createElement('div')
    el.innerHTML=`<div class="s-it ${n===CUR_TAB?'on':''}" data-t="${n}"><span class="ic" style="color:${t.ic}">▚</span>${n}<span class="r">${t.rows}</span></div>`
    if(n===CUR_TAB)t.cols.forEach(c=>el.insertAdjacentHTML('beforeend',`<div class="s-col">${c[0]} <span class="ty">${c[1]}</span></div>`))
    sTree.appendChild(el)
  })
  document.querySelectorAll('.s-it').forEach(it=>it.addEventListener('click',()=>{CUR_TAB=it.dataset.t;renderSchema();renderResults()}))
  document.getElementById('scMeta').textContent=`${Object.keys(db.tables).length} 表`
}
function renderResults(){
  const db=DBS[CUR]
  if(!CUR_TAB){rBody.innerHTML='<div class="empty">← 选择一张表，或让 AI 生成查询</div>';return}
  const t=db.tables[CUR_TAB]
  document.getElementById('rSql').textContent=`SELECT * FROM ${CUR_TAB} LIMIT 500`
  document.getElementById('rMs').textContent=`${t.rows} 行 · 预览`
  document.getElementById('rFst').className='fst ok';document.getElementById('rFst').textContent='READ · ALLOW'
  rBody.innerHTML='<table class="t"><thead><tr>'+t.cols.map(c=>`<th>${c[0]}<span class="ty">${c[1]}</span></th>`).join('')+'</tr></thead><tbody>'+t.data.map(r=>'<tr>'+r.map((v,i)=>`<td${/int|real/.test(t.cols[i][1])?' class="num"':''}>${v}</td>`).join('')+'</tr>').join('')+'</tbody></table>'
}
function switchDb(k){
  CUR=k;const db=DBS[k]
  document.getElementById('dsDot').style.background=db.dot
  document.getElementById('dsName').textContent=k
  document.getElementById('slDialect').textContent=db.dialect
  document.querySelectorAll('.ds-mi').forEach(m=>m.querySelector('.ck').textContent=m.dataset.db===k?'✓':'')
  CUR_TAB=null;renderSchema();renderResults()
  addMsg('a',`已切换到 <b>${k}</b>（${db.dialect}）· schema 与上下文已刷新。`,'txt')
}
function addMsg(who,html,cls){
  const d=document.createElement('div');d.className=who==='u'?'m-u':'m-a'
  d.innerHTML=cls?`<div class="${cls}">${html}</div>`:html
  aScroll.appendChild(d);aScroll.scrollTop=aScroll.scrollHeight;return d
}
function addCard(tier,think,txt,sql,extra){
  const d=addMsg('a','')
  d.innerHTML=`<div class="thk">${think}</div><div class="txt">${txt}</div><div class="sql ${tier}"><div class="c-bar"></div><div class="c-h"><span class="v">${tier.toUpperCase()}</span>${tier==='allow'?' · read':tier==='review'?' · dml':tier==='block'?' · blocked':' · ddl'}</div><div class="c-s">${sql}</div><div class="c-f">${extra||''}<button class="btn ${tier==='allow'?'pri':tier==='review'?'warn':tier==='manual'?'gho':'danger'}" data-act="${tier}">${tier==='allow'?'运行':tier==='review'?'确认执行':tier==='manual'?'发送到编辑器':'已拦截'}</button></div></div>`
  return d
}
function send(q){
  addMsg('u',q)
  setTimeout(()=>{
    const r=aiReply(q)
    const extra=r.tier==='review'?`<span class="c-p">${r.p}</span>`:r.tier==='block'?`<span class="c-r">${r.r}</span>`:''
    addCard(r.tier,r.think,r.txt,r.sql,extra)
    aScroll.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.act
      if(t==='allow'){const sql=b.closest('.sql').querySelector('.c-s').textContent;const m=sql.match(/FROM\s+(\w+)/i);if(m){CUR_TAB=m[1];renderSchema();renderResults()}}
      if(t==='review'){b.textContent='已确认执行 ✓';b.style.color='var(--teal)';b.style.borderColor='var(--teal)';b.style.background='var(--teal-dim)'}
      if(t==='manual'){b.textContent='已发送到编辑器 ✓';b.style.color='var(--blue)'}
    }))
  },450)
}
function setSkin(k){
  document.documentElement.dataset.skin=k
  document.getElementById('skinName').textContent=SKINS[k][0]
  document.getElementById('skinDim').textContent=SKINS[k][1]
  document.querySelectorAll('.sk-mi').forEach(m=>m.querySelector('.ck').textContent=m.dataset.skin===k?'✓':'')
  try{localStorage.setItem('tabletalk-skin',k)}catch{}
}
document.getElementById('dsBtn').addEventListener('click',()=>document.getElementById('ds').classList.toggle('open'))
document.addEventListener('click',e=>{if(!e.target.closest('#ds'))document.getElementById('ds').classList.remove('open')})
document.querySelectorAll('.ds-mi').forEach(m=>m.addEventListener('click',()=>{switchDb(m.dataset.db);document.getElementById('ds').classList.remove('open')}))
document.getElementById('skinBtn').addEventListener('click',()=>document.getElementById('skin').classList.toggle('open'))
document.addEventListener('click',e=>{if(!e.target.closest('#skin'))document.getElementById('skin').classList.remove('open')})
document.querySelectorAll('.sk-mi').forEach(m=>m.addEventListener('click',()=>{setSkin(m.dataset.skin);document.getElementById('skin').classList.remove('open')}))
document.getElementById('aSend').addEventListener('click',()=>{const f=document.getElementById('aField');const q=f.textContent.trim();if(q&&!q.startsWith('ask your')){f.textContent='ask your database…';send(q)}})
document.getElementById('aField').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('aSend').click()}})
document.getElementById('aField').addEventListener('focus',()=>{if(document.getElementById('aField').textContent.startsWith('ask your'))document.getElementById('aField').textContent=''})
document.getElementById('aField').addEventListener('blur',()=>{if(!document.getElementById('aField').textContent.trim())document.getElementById('aField').textContent='ask your database…'})
;(()=>{let k='neon';try{k=localStorage.getItem('tabletalk-skin')||'neon'}catch{};setSkin(k)})()
renderSchema()
addMsg('a','我是 TABLETALK 的 AI 副驾。试试问 <b>退货率最高的 10 个商品</b>，或输入 <span style="color:var(--red)">delete from orders</span> 看安全闸门拦截。','txt')
</script>
</body>
</html>
