<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · 精密三栏工作台 · TABLETALK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa;--surface:#ffffff;--surface-2:#f1f3f6;--surface-3:#eceef2;
  --line:#e6e9ef;--line-strong:#d4d9e2;
  --ink:#161a22;--ink-dim:#5a6472;--ink-faint:#99a2b0;
  --teal:#0aa06b;--teal-dim:rgba(10,160,107,.09);
  --amber:#b4760e;--amber-dim:rgba(180,118,14,.09);
  --red:#d4453a;--red-dim:rgba(212,69,58,.08);
  --blue:#2f6fd0;--blue-dim:rgba(47,111,208,.08);
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  --sans:'Instrument Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.2,.8,.24,1);
  --grid:rgba(26,44,80,.04);
}
html[data-theme="dark"]{
  --bg:#0c0f15;--surface:#11151d;--surface-2:#0e121a;--surface-3:#171c26;
  --line:#1c2230;--line-strong:#2a3344;
  --ink:#e7ebf3;--ink-dim:#8b94a6;--ink-faint:#57637c;
  --teal:#2fc38c;--teal-dim:rgba(47,195,140,.11);
  --amber:#e0a347;--amber-dim:rgba(224,163,71,.11);
  --red:#ee6559;--red-dim:rgba(238,101,89,.1);
  --blue:#6d9cf0;--blue-dim:rgba(109,156,240,.11);
  --grid:rgba(160,180,215,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 34px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/34px 100%,
  var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .3s}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:48px 1fr 28px;height:100vh}
/* topbar */
.appbar{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.16em}
.logo .dot{width:8px;height:8px;border-radius:2px;background:var(--teal);transform:rotate(45deg);animation:armed 2.8s infinite}
@keyframes armed{0%{box-shadow:0 0 0 0 rgba(10,160,107,.35)}75%{box-shadow:0 0 0 7px rgba(10,160,107,0)}100%{box-shadow:0 0 0 0 rgba(10,160,107,0)}}
/* 数据源切换（全局锚） */
.ds{position:relative}
.ds-btn{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;padding:6px 12px;border:1.5px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.ds-btn:hover{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.ds-btn .ds-dot{width:7px;height:7px;border-radius:50%;flex:none}
.ds-btn .ds-chev{font-size:8px;color:var(--ink-faint);transition:transform .2s}
.ds.open .ds-btn .ds-chev{transform:rotate(180deg)}
.ds-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:5px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(-5px);transition:all .18s var(--ease);z-index:50}
.ds.open .ds-menu{opacity:1;pointer-events:auto;transform:none}
.ds-mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;transition:background .12s}
.ds-mi:hover{background:var(--surface-2)}
.ds-mi .d{width:7px;height:7px;border-radius:50%;flex:none}
.ds-mi .n{font-family:var(--mono);font-size:11px}
.ds-mi .s{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--ink-faint)}
.ds-mi .ck{color:var(--teal);font-size:10px;width:12px;text-align:center}
.ds-title{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;padding:6px 10px 4px}
.ds-note{font-family:var(--mono);font-size:9px;color:var(--ink-faint);padding:7px 10px 3px;line-height:1.5}
.tabs{display:flex;gap:2px;height:100%;margin-left:14px}
.tab{display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);position:relative;transition:color .14s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--teal)}
.spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink-dim);padding:5px 10px;border:1px solid var(--line-strong);border-radius:6px;transition:all .14s}
.tbtn:hover{color:var(--ink);border-color:var(--ink-faint)}
/* workbench */
.wb{display:grid;grid-template-columns:220px 1fr 300px;gap:10px;padding:10px;min-height:0}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.col-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:.05em;flex:none}
.col-h .meta{margin-left:auto;font-size:8.5px;color:var(--ink-faint)}
/* schema */
.s-search{padding:8px;border-bottom:1px solid var(--line)}
.s-in{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid transparent;border-radius:6px;padding:5px 9px;font-size:11px;color:var(--ink-faint)}
.s-in:focus-within{border-color:var(--teal)}
.s-tree{flex:1;overflow:auto}
.s-sec{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink-faint);text-transform:uppercase;padding:9px 12px 4px}
.s-it{display:flex;align-items:center;gap:7px;padding:4.5px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);cursor:pointer;border-left:2px solid transparent;line-height:1.7;transition:background .1s,color .1s}
.s-it:hover{background:var(--teal-dim);color:var(--ink)}
.s-it.on{background:var(--teal-dim);color:var(--ink);border-left-color:var(--teal)}
.s-it .r{font-size:8px;color:var(--ink-faint);margin-left:auto}
.s-it .ic{font-size:9px;width:12px;text-align:center}
.s-col{padding-left:30px;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);line-height:1.7}
.s-col .ty{font-size:8px;color:var(--ink-faint);opacity:.8}
/* results */
.r-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;flex:none}
.fst{font-size:8px;padding:2px 7px;border-radius:10px;flex:none}
.fst.ok{color:var(--teal);background:var(--teal-dim)}
.fst.warn{color:var(--amber);background:var(--amber-dim)}
.fst.bad{color:var(--red);background:var(--red-dim)}
.r-sql{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-ms{margin-left:auto;font-size:9px;color:var(--ink-faint);white-space:nowrap}
.r-body{flex:1;overflow:auto}
table.t{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:6px 11px;color:var(--ink-faint);font-weight:500;font-size:8.5px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.t th .ty{font-weight:400;font-size:8px;color:var(--ink-faint);margin-left:4px}
.t th .arr{color:var(--teal);font-size:7px;margin-left:3px}
.t td{padding:5px 11px;border-bottom:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
.t td.num{text-align:right}
.t tbody tr:hover td{background:var(--surface-2);color:var(--ink)}
.t .empty{padding:26px;text-align:center;color:var(--ink-faint);font-family:var(--sans);font-size:12px}
/* ai */
.a-scroll{flex:1;overflow:auto;padding:11px;display:flex;flex-direction:column;gap:12px}
.m-u{align-self:flex-end;max-width:88%;font-size:12px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:7px 11px;color:var(--ink)}
.m-a{align-self:stretch;display:flex;flex-direction:column;gap:7px}
.thk{font-family:var(--mono);font-size:9px;color:var(--ink-faint);line-height:1.5}
.thk::before{content:"◇ think";color:var(--blue);letter-spacing:.08em;margin-right:7px;font-size:8px}
.m-a .txt{font-size:12px;color:var(--ink-dim);line-height:1.6}
.sql{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sql .c-bar{height:2px}
.sql.allow .c-bar{background:var(--teal)}.sql.review .c-bar{background:var(--amber)}.sql.block .c-bar{background:var(--red)}.sql.manual .c-bar{background:var(--blue)}
.sql .c-h{display:flex;align-items:center;gap:7px;padding:6px 10px;font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);letter-spacing:.08em}
.sql .c-h .v{font-weight:600}
.sql.allow .v{color:var(--teal)}.sql.review .v{color:var(--amber)}.sql.block .v{color:var(--red)}.sql.manual .v{color:var(--blue)}
.sql .c-s{font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);padding:7px 10px;line-height:1.7;border-top:1px solid var(--line);white-space:pre-wrap}
.sql .c-f{display:flex;gap:6px;padding:7px 10px;border-top:1px solid var(--line);align-items:center}
.sql .c-p{font-size:9.5px;color:var(--amber);margin-right:auto;font-family:var(--mono)}
.sql .c-r{font-size:9.5px;color:var(--red);margin-right:auto;font-family:var(--mono)}
.btn{font-family:var(--mono);font-size:9.5px;padding:4px 10px;border-radius:6px;border:1px solid transparent;transition:all .14s}
.btn.pri{background:var(--teal);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.gho{color:var(--ink-dim);border-color:var(--line-strong)}
.btn.gho:hover{color:var(--ink);border-color:var(--ink-faint)}
.btn.warn{color:var(--amber);border-color:var(--amber);background:var(--amber-dim)}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--red-dim)}
.a-in{display:flex;gap:7px;padding:9px 11px;border-top:1px solid var(--line);flex:none}
.a-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:7px;padding:7px 10px;font-size:11.5px;color:var(--ink-faint);transition:border-color .14s}
.a-field:focus-within{border-color:var(--teal)}
.a-field .kbd{font-size:8px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;margin-left:auto;font-family:var(--mono)}
.send{width:30px;height:30px;border-radius:7px;background:var(--teal);color:#fff;font-size:13px;flex:none;transition:filter .14s}
.send:hover{filter:brightness(1.07)}
/* statusline */
.statusline{display:flex;align-items:center;gap:20px;padding:0 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--ink-faint);background:var(--surface)}
.gate{display:flex;align-items:center;gap:8px}
.sig{position:relative;width:90px;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.sig i{position:absolute;inset:0;background:var(--teal);transform-origin:left;animation:sw 2.4s var(--ease) infinite}
@keyframes sw{0%{transform:scaleX(0)}55%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.gv{color:var(--teal);font-weight:600}
.sl-r{margin-left:auto;display:flex;gap:18px}
.sl-r b{color:var(--ink-dim);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <span class="logo"><span class="dot"></span>TABLETALK</span>
    <!-- 数据源切换（全局锚） -->
    <div class="ds" id="ds">
      <button class="ds-btn" id="dsBtn"><span class="ds-dot" id="dsDot" style="background:var(--teal)"></span><span id="dsName">demo.db</span><span class="ds-chev">▼</span></button>
      <div class="ds-menu">
        <div class="ds-title">数据源 · 切换后全局跟随</div>
        <button class="ds-mi" data-db="demo.db"><span class="d" style="background:var(--teal)"></span><span class="n">demo.db</span><span class="s">sqlite</span><span class="ck">✓</span></button>
        <button class="ds-mi" data-db="prod-mysql"><span class="d" style="background:var(--blue)"></span><span class="n">prod-mysql</span><span class="s">mysql</span><span class="ck"></span></button>
        <button class="ds-mi" data-db="analytics-pg"><span class="d" style="background:var(--amber)"></span><span class="n">analytics-pg</span><span class="s">postgres</span><span class="ck"></span></button>
        <div class="ds-note">schema · 知识图谱 · 审计 · AI 上下文 全部跟随当前数据源</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on">工作台</button><button class="tab">安全闸门</button><button class="tab">知识图谱</button><button class="tab">审计</button>
    </nav>
    <span class="spacer"></span>
    <button class="tbtn" id="themeToggle">🌓 深色</button>
  </header>

  <main class="wb">
    <!-- schema -->
    <div class="col">
      <div class="col-h">schema<span class="meta" id="scMeta"></span></div>
      <div class="s-search"><div class="s-in">⌕ filter…</div></div>
      <div class="s-tree" id="sTree"></div>
    </div>
    <!-- results -->
    <div class="col">
      <div class="r-head"><span class="fst ok" id="rFst">READ · ALLOW</span><span class="r-sql" id="rSql"></span><span class="r-ms" id="rMs"></span></div>
      <div class="r-body" id="rBody"></div>
    </div>
    <!-- ai -->
    <div class="col">
      <div class="col-h">assistant<span class="meta">model: mock</span></div>
      <div class="a-scroll" id="aScroll"></div>
      <div class="a-in">
        <div class="a-field" contenteditable="true" id="aField" data-ph="ask your database…">ask your database…</div>
        <button class="send" id="aSend">→</button>
      </div>
    </div>
  </main>

  <footer class="statusline">
    <span class="gate"><span>gate</span><span class="sig"><i></i></span><span class="gv">armed</span></span>
    <span>model : mock</span>
    <span>dialect : <b id="slDialect">sqlite</b></span>
    <div class="sl-r"><span>audit <b>128</b></span><span>ai <b id="slAi">idle</b></span><span>⌘K 聚焦 · ⌘⏎ 运行</span></div>
  </footer>
</div>

<script>
// ============ 数据源 mock ============
const DBS={
  'demo.db':{dot:'var(--teal)',dialect:'sqlite',tables:{
    orders:{rows:'12.4k',ic:'teal',cols:[['id','int'],['customer_id','fk'],['status','text'],['total','real'],['created_at','datetime']],data:[['10248','31','shipped','440.00','2026-08-01 09:12'],['10249','44','pending','1863.40','2026-08-01 10:03'],['10250','8','shipped','1552.60','2026-08-02 14:41'],['10251','22','cancelled','654.06','2026-08-03 08:55']]},
    customers:{rows:'3.1k',ic:'blue',cols:[['id','int'],['name','text'],['region','text'],['level','text']],data:[['1','Acme Trading','华东','gold'],['2','北辰工业','华北','silver'],['3','Blue Harbor','华南','gold']]},
    products:{rows:'1.2k',ic:'blue',cols:[['id','int'],['name','text'],['price','real'],['category_id','fk']],data:[['101','低温酸奶 200g','12.50','3'],['102','全脂牛奶 1L','15.00','3'],['103','手冲咖啡豆','88.00','6']]},
    categories:{rows:'86',ic:'blue',cols:[['id','int'],['name','text']],data:[['3','乳品'],['6','咖啡茶饮'],['9','零食']]},
    order_items:{rows:'31.8k',ic:'blue',cols:[['id','int'],['order_id','fk'],['product_id','fk'],['qty','int'],['price','real']],data:[['1','10248','101','2','12.50'],['2','10248','102','1','15.00'],['3','10249','103','1','88.00']]},
    suppliers:{rows:'54',ic:'blue',cols:[['id','int'],['name','text'],['city','text']],data:[['1','乳源牧业','呼和浩特'],['2','云岭农科','昆明']]}
  }},
  'prod-mysql':{dot:'var(--blue)',dialect:'mysql',tables:{
    inventory:{rows:'8.2k',ic:'blue',cols:[['sku','varchar'],['qty','int'],['reorder','int'],['warehouse','varchar']],data:[['SKU-1001','42','20','WH-华东'],['SKU-1002','6','20','WH-华东'],['SKU-2001','118','50','WH-华南']]},
    users:{rows:'45k',ic:'blue',cols:[['id','int'],['email','varchar'],['status','enum'],['last_login','datetime']],data:[['1','a@x.com','active','2026-08-15'],['2','b@x.com','suspended','2026-07-30']]},
    payments:{rows:'120k',ic:'blue',cols:[['id','int'],['order_id','int'],['amount','decimal'],['method','varchar']],data:[['1','88401','99.00','alipay'],['2','88402','340.50','wechat']]},
    shipments:{rows:'118k',ic:'blue',cols:[['id','int'],['order_id','int'],['status','enum'],['carrier','varchar']],data:[['1','88401','delivered','顺丰'],['2','88402','in_transit','京东']]},
    refunds:{rows:'3.1k',ic:'blue',cols:[['id','int'],['order_id','int'],['amount','decimal'],['reason','varchar']],data:[['1','88010','99.00','质量问题'],['2','88120','45.00','发错货']]}
  }},
  'analytics-pg':{dot:'var(--amber)',dialect:'postgres',tables:{
    events:{rows:'2.1M',ic:'blue',cols:[['id','bigint'],['ts','timestamptz'],['event','text'],['user_id','int']],data:[['1','2026-08-16 00:01','page_view','9041'],['2','2026-08-16 00:02','signup','9042']]},
    sessions:{rows:'410k',ic:'blue',cols:[['id','uuid'],['start','timestamptz'],['end','timestamptz'],['pages','int']],data:[['s-001','2026-08-16 00:01','2026-08-16 00:12','7'],['s-002','2026-08-16 00:03','2026-08-16 00:04','2']]},
    funnel_steps:{rows:'22k',ic:'blue',cols:[['step','text'],['conversion','numeric'],['dropoff','int']],data:[['visit','100.0%','0'],['signup','42.3%','58'],['paid','11.8%','72']]},
    cohorts:{rows:'96',ic:'blue',cols:[['month','date'],['retention_d30','numeric'],['n_users','int']],data:[['2026-05','38.2%','1204'],['2026-06','41.5%','1388']]}
  }}
}
// ============ AI mock ============
function aiReply(q){
  const s=q.toLowerCase()
  if(s.includes('delete')||s.includes('删'))return{tier:'block',think:'检测到无条件删除，安全闸门将拦截',txt:'这条 DELETE 会被闸门拦截：',sql:"DELETE FROM orders",r:'无 WHERE 的 DELETE 被拦截',sugg:true}
  if(s.includes('update')||s.includes('改价')||s.includes('更新'))return{tier:'review',think:'写操作需确认：先算影响行预览',txt:'写操作，影响行预览后需你确认：',sql:"UPDATE products SET price = price * 1.05 WHERE category_id = 3",p:'将影响约 24 行'}
  if(s.includes('create')||s.includes('索引')||s.includes('建表'))return{tier:'manual',think:'DDL：AI 只生成草稿，不执行',txt:'DDL 草稿已生成，可发送到编辑器手动执行：',sql:"CREATE INDEX idx_orders_status ON orders(status)"}
  if(s.includes('退货'))return{tier:'allow',think:'orders.status 区分退货 → 按商品聚合退货占比 → 排序取前 10',txt:'已生成查询，读操作直接放行：',sql:"SELECT p.name, COUNT(*) AS total,\n  SUM(o.status='returned') AS ret,\n  ROUND(1.0*SUM(o.status='returned')/COUNT(*),3) AS rate\nFROM order_items oi\nJOIN orders o ON o.id=oi.order_id\nJOIN products p ON p.id=oi.product_id\nGROUP BY p.name ORDER BY rate DESC LIMIT 10"}
  if(s.includes('销售')||s.includes('金额'))return{tier:'allow',think:'按品类关联订单聚合销售额',txt:'已生成查询：',sql:"SELECT c.name, ROUND(SUM(oi.price*oi.qty),2) sales\nFROM categories c JOIN products p ON p.category_id=c.id\nJOIN order_items oi ON oi.product_id=p.id\nJOIN orders o ON o.id=oi.order_id\nGROUP BY c.name ORDER BY sales DESC"}
  return{tier:'allow',think:'按订单明细聚合统计',txt:'已生成查询：',sql:"SELECT c.name, COUNT(o.id) AS orders\nFROM customers c JOIN orders o ON o.customer_id=c.id\nGROUP BY c.name ORDER BY orders DESC LIMIT 10"}
}
// ============ render ============
let CUR='demo.db', CUR_TAB=null
const sTree=document.getElementById('sTree'),rBody=document.getElementById('rBody'),aScroll=document.getElementById('aScroll')
const ic={teal:'var(--teal)',blue:'var(--blue)'}
function renderSchema(){
  const db=DBS[CUR];sTree.innerHTML=''
  sTree.insertAdjacentHTML('beforeend','<div class="s-sec">tables</div>')
  Object.entries(db.tables).forEach(([n,t])=>{
    const el=document.createElement('div')
    el.innerHTML=`<div class="s-it ${n===CUR_TAB?'on':''}" data-t="${n}"><span class="ic" style="color:${ic[t.ic]}">▚</span>${n}<span class="r">${t.rows}</span></div>`
    if(n===CUR_TAB) t.cols.forEach(c=>el.insertAdjacentHTML('beforeend',`<div class="s-col">${c[0]} <span class="ty">${c[1]}</span></div>`))
    sTree.appendChild(el)
  })
  document.querySelectorAll('.s-it').forEach(it=>it.addEventListener('click',()=>{CUR_TAB=it.dataset.t;renderSchema();renderResults()}))
  document.getElementById('scMeta').textContent=`${Object.keys(db.tables).length} 表`
}
function renderResults(){
  const db=DBS[CUR]
  if(!CUR_TAB){rBody.innerHTML='<div class="empty">← 左侧选择一张表，或让 AI 生成查询</div>';return}
  const t=db.tables[CUR_TAB]
  document.getElementById('rSql').textContent=`SELECT * FROM ${CUR_TAB} LIMIT 500`
  document.getElementById('rMs').textContent=`${t.rows} 行 · 预览`
  document.getElementById('rFst').className='fst ok';document.getElementById('rFst').textContent='READ · ALLOW'
  rBody.innerHTML='<table class="t"><thead><tr>'+t.cols.map(c=>`<th>${c[0]}<span class="ty">${c[1]}</span></th>`).join('')+'</tr></thead><tbody>'+t.data.map(r=>'<tr>'+r.map((v,i)=>`<td${t.cols[i][1]==='real'||t.cols[i][1]==='int'?' class="num"':''}>${v}</td>`).join('')+'</tr>').join('')+'</tbody></table>'
}
function switchDb(k){
  CUR=k;const db=DBS[k]
  document.getElementById('dsDot').style.background=db.dot
  document.getElementById('dsName').textContent=k
  document.getElementById('slDialect').textContent=db.dialect
  document.querySelectorAll('.ds-mi').forEach(m=>m.querySelector('.ck').textContent=(m.dataset.db===k?'✓':''))
  CUR_TAB=null;renderSchema();renderResults()
  addMsg('a',`已切换到 <b style="color:var(--ink)">${k}</b>（${db.dialect}）。左侧 schema 已刷新，可以问 AI 或浏览表结构。`,'txt')
}
// ============ AI ============
function addMsg(who,html,cls){
  const d=document.createElement('div');d.className=who==='u'?'m-u':'m-a'
  d.innerHTML=cls?`<div class="${cls}">${html}</div>`:html
  aScroll.appendChild(d);aScroll.scrollTop=aScroll.scrollHeight;return d
}
function addCard(tier,think,txt,sql,extra){
  const d=addMsg('a',think?'':'')
  if(think)d.innerHTML=`<div class="thk">${think}</div><div class="txt">${txt}</div><div class="sql ${tier}"><div class="c-bar"></div><div class="c-h"><span class="v">${tier.toUpperCase()}</span>${tier==='allow'?' · read':tier==='review'?' · dml':tier==='block'?' · dml':' · ddl'}</div><div class="c-s">${sql}</div><div class="c-f">${extra||''}<button class="btn ${tier==='allow'?'pri':tier==='review'?'warn':tier==='manual'?'gho':'danger'}" data-act="${tier}">${tier==='allow'?'运行':tier==='review'?'确认执行':tier==='manual'?'发送到编辑器':'已拦截'}</button></div></div>`
  else d.innerHTML=`<div class="sql ${tier}"><div class="c-bar"></div><div class="c-h"><span class="v">${tier.toUpperCase()}</span></div><div class="c-s">${sql}</div><div class="c-f">${extra||''}<button class="btn ${tier==='allow'?'pri':'gho'}" data-act="${tier}">${tier==='allow'?'运行':'查看'}</button></div></div>`
  return d
}
function send(q){
  addMsg('u',q)
  document.getElementById('slAi').textContent='thinking'
  setTimeout(()=>{
    const r=aiReply(q)
    const extra=r.tier==='review'?`<span class="c-p">${r.p}</span>`:r.tier==='block'?`<span class="c-r">${r.r}</span>`:r.sugg?`<span class="c-r">${r.r}</span>`:''
    addCard(r.tier,r.think,r.txt,r.sql,extra)
    document.getElementById('slAi').textContent='idle'
    bindCardActions()
  },450)
}
function bindCardActions(){
  aScroll.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
    const tier=b.dataset.act
    if(tier==='allow'){const sql=b.closest('.sql').querySelector('.c-s').textContent.replace(/\s+/g,' ').trim();const m=sql.match(/FROM\s+(\w+)/i);CUR_TAB=m?m[1]:CUR_TAB;renderResults();document.getElementById('rFst').textContent='READ · ALLOW'}
    if(tier==='review'){b.textContent='已确认执行';b.style.color='var(--teal)';b.style.borderColor='var(--teal)';b.style.background='var(--teal-dim)'}
    if(tier==='manual'){b.textContent='已发送到编辑器 ✓';b.style.color='var(--blue)'}
    if(tier==='block'){}
  }))
}
// ============ 事件 ============
document.getElementById('dsBtn').addEventListener('click',()=>document.getElementById('ds').classList.toggle('open'))
document.addEventListener('click',e=>{if(!e.target.closest('#ds'))document.getElementById('ds').classList.remove('open')})
document.querySelectorAll('.ds-mi').forEach(m=>m.addEventListener('click',()=>{switchDb(m.dataset.db);document.getElementById('ds').classList.remove('open')}))
document.getElementById('aSend').addEventListener('click',()=>{const f=document.getElementById('aField');const q=f.textContent.trim();if(q&&!q.startsWith('ask your')){f.textContent='ask your database…';send(q)}})
document.getElementById('aField').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('aSend').click()}})
document.getElementById('aField').addEventListener('focus',()=>{if(document.getElementById('aField').textContent.startsWith('ask your'))document.getElementById('aField').textContent=''})
document.getElementById('aField').addEventListener('blur',()=>{if(!document.getElementById('aField').textContent.trim())document.getElementById('aField').textContent='ask your database…'})
document.getElementById('themeToggle').addEventListener('click',()=>{const d=document.documentElement.dataset.theme;document.documentElement.dataset.theme=d==='dark'?'light':'dark';document.getElementById('themeToggle').textContent=d==='dark'?'🌓 深色':'☀ 浅色'})
// init
renderSchema()
addMsg('a','我是 TABLETALK 的 AI 副驾。试试问 <b style="color:var(--ink)">退货率最高的 10 个商品</b>，或输入 <span class="mono" style="color:var(--red)">delete from orders</span> 看安全闸门拦截。','txt')
</script>
